appId: com.deepseek.dsh.desktop
productName: DSH Desktop
copyright: MIT License
# 仅保留中英文，移除 Electron 其余 53 个语言包（.pak，约 80MB），
# 不影响功能体验（右键菜单/DevTools 等界面语言随系统 locale 取 en-US/zh-CN）。
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: dist
  buildResources: build

# electron-builder strips nested node_modules from extraResources; this hook
# restores the bundled npm CLI's own dependencies after packing.
afterPack: scripts/after-pack.js

# Native modules (sharp / node-pty / koffi) are loaded by the bundled plain
# node.exe, so keep everything as real files and never rebuild for Electron.
asar: false
npmRebuild: false
buildDependenciesFromSource: false

files:
  - main.js
  - updater.js
  - client-updater.js
  - balance.js
  - session-watcher.js
  - preload.js
  - renderer-recovery.js
  - profile-manifest.js
  - profile-patch-heal.js
  - profile-bundle-heal.js
  - wsl-backend.js
  - watchdog.js
  - assets/**/*
  # 运行时依赖：koffi 预检、依赖自愈补丁等脚本必须在成品里存在。
  - scripts/**/*
  - package.json
  - "!**/*.md"
  # `!**/*.md` above would strip every .md from node_modules too, which removes
  # the SKILL.md files the bundled @deepseek-ai/dsh ships for its agent presets
  # (editing-cordis-compositions, cordis-plugin-development) and silently breaks
  # the 创造模式 skills. Re-include them: later patterns override earlier ones.
  - "**/SKILL.md"

extraResources:
  - from: vendor/node/node.exe
    to: node/node.exe
  - from: vendor/npm
    to: npm

win:
  icon: build/icon.png
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: DSH-Desktop-${version}-portable-${arch}.${ext}
  # 稳定缓存目录名：配合 scripts/patch-portable-template.js 复用已解压目录，
  # 避免每次启动都解压 app-64.7z（Defender 扫描 2.4 万文件导致分钟级冷启动）。
  unpackDirName: dsh-desktop-portable

nsis:
  artifactName: DSH-Desktop-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  uninstallDisplayName: DSH Desktop

publish: null
