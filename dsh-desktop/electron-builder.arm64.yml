# ARM64 (win32-arm64) 构建配置 —— 与 electron-builder.yml 的 x64 配置同源，
# 差异仅在目标架构与便携版缓存目录名（避免同一台机器上 x64/arm64 便携版
# 共用 %TEMP% 解压缓存导致架构错乱）。
#
# 用法（在 x64 Windows 机器上交叉构建）：
#   1) npm ci                                # 安装 x64 依赖
#   2) node scripts/install-arm64-prebuilds.js
#                                            # 补装 arm64 原生预编译包（自带 PE 校验；
#                                            # 运行时按 process.arch 动态选择平台包）
#   3) node scripts/fetch-node.js --arch=arm64
#                                            # 从 nodejs.org 下载同版本 arm64 node.exe
#   4) node scripts/patch-portable-template.js && node scripts/patch-deps.js
#   5) npx electron-builder --win --config electron-builder.arm64.yml
#
# node-pty 自带 win32-arm64 预编译（prebuilds/），无需额外安装。
appId: com.deepseek.dsh.desktop
productName: DSH Desktop
copyright: MIT License
electronLanguages:
  - en-US
  - zh-CN
directories:
  output: dist
  buildResources: build

afterPack: scripts/after-pack.js

# 原生模块（sharp / node-pty / koffi）由内置的 plain node.exe 加载，
# 全部使用预编译二进制，不做任何 Electron 侧重编译。
asar: false
npmRebuild: false
buildDependenciesFromSource: false

files:
  - main.js
  - updater.js
  - client-updater.js
  - balance.js
  - balance-scheduler.js
  - session-watcher.js
  - preload.js
  - renderer-recovery.js
  - profile-manifest.js
  - profile-patch-heal.js
  - wsl-backend.js
  - watchdog.js
  - assets/**/*
  - scripts/**/*
  - package.json
  - "!**/*.md"
  - "**/SKILL.md"

extraResources:
  - from: vendor/node/node.exe
    to: node/node.exe
  - from: vendor/npm
    to: npm
  # Custom uninstaller: installer.nsh copies this to $INSTDIR during install.
  - from: build/Uninstall_DSH_Desktop.exe
    to: Uninstall_DSH_Desktop.exe

win:
  icon: build/icon.png
  target:
    - target: portable
      arch:
        - arm64
    - target: nsis
      arch:
        - arm64

portable:
  # 命名规则：v0.3.9 式（无 win- 中缀），Release 页面一眼区分形态与芯片。
  # 注意保持「-portable-<arch>.exe」后缀，兼容已发布版本的客户端更新正则。
  artifactName: DSH-Desktop-${version}-portable-${arch}.${ext}
  # 与 x64 版（dsh-desktop-portable）隔离，防止同一机器上双架构便携版串缓存。
  unpackDirName: dsh-desktop-portable-arm64

nsis:
  artifactName: DSH-Desktop-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DSH Desktop
  uninstallDisplayName: DSH Desktop
  # Replace the default NSIS uninstaller with our custom Uninstall_DSH_Desktop.exe.
  include: uninstaller/installer.nsh

publish: null
