# dsh-conversation-tweaks 的 bundle 层 patch（自挂载声明）
#
# 用途：会话体验微调：隐藏长篇输出 + 右侧导航滑轨。
#
# 为什么必须由包自带这份 patch：纯插件包形态下没有壳层替我们写用户 profile 的
# cordis.patch.yml（旧壳 companion-profile.js 那台机器已退役）。实测结论见
# docs/spike-official-client.md §0.1：`dsh plugin add <本包>` 只把包名写进 profile 的
# dependencies 与 dsh.profile.bundles，profile 自己那层 patch 保持出厂 []；真正把插件
# 装进 cordis 插件栈的是包自己的这一层（由 package.json 的 dsh.bundle.patch 指过来）。
#
# ⚠ 稳定契约：id 是 cordis 补丁按行寻址的键。改 id 会让用户写在
#   $DSH_HOME/cordis.patch.yml 里的 "- id: conversation-tweaks / disabled: true" 覆盖失配成孤儿行；
#   本仓库为此付过学费——dsh-super-injector 的 id 与 bundle 层声明不一致时，自愈的
#   dropBlocksByIds 永不命中残留行，造成双登记启动崩溃（issue #104）。不许改。
# ⚠ patch 按 id 整行替换（无字段级 merge），config 块只能整体给出、不许半份。
# ⚠ 禁止在本行写 `disabled: !!js`：必选行上抛错的 !!js 会直接中断启动。
- insert:
    - id: conversation-tweaks
      name: '@deepseek-ai/dsh-conversation-tweaks'
