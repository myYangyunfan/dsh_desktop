  # --- macOS -------------------------------------------------------------
  # 两个 mac job 都跑在 macos-14（Apple Silicon）公共 runner 上：
  # arm64 腿原生构建；x64 腿交叉构建（补装 darwin-x64 原生变体 + 下载
  # darwin-x64 node）。Mach-O 架构用 lipo 校验（PE 的 Get-MachineType
  # 不适用于 mac 二进制）。

  build-mac-x64:
    name: build-mac-x64
    if: >-
      github.event_name == 'push' ||
      inputs.mac == 'both' ||
      inputs.mac == 'x64'
    runs-on: macos-14
    defaults:
      run:
        working-directory: dsh-desktop
    env:
      ARCH: x64
      UNPACKED: mac
      DIST_SUFFIX: '--x64'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 交叉构建：arm64 构建机补装 darwin-x64 原生预编译包（koffi / sharp /
      # sharp-libvips / node-addon-require-builtin；node-pty 的 darwin-x64
      # 预编译已随主包分发）。脚本自带 lipo 架构校验，装错会直接失败。
      - name: Install x64 native prebuilds
        run: node scripts/install-darwin-x64-prebuilds.js

      # vendor/ 不进 git（.gitignore 排除），构建前现场生成：
      # x64：从 nodejs.org 下载同版本 darwin-x64 node（arm64 构建机无法
      # 本地复制出 x64 的 node）。npm CLI（纯 JS）两架构通用。
      - name: Fetch runtime (vendor/node + vendor/npm)
        shell: pwsh
        run: |
          node scripts/fetch-node.js --platform=darwin --arch=x64
          npm run fetch-npm

      # 打包前校验所有运行时原生二进制确实是目标架构（Mach-O，lipo）。
      - name: Verify native binaries architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-MachOArchs([string]$Path) {
            $out = (& lipo -archs $Path 2>$null) -join ' '
            if ($LASTEXITCODE -ne 0) { throw "lipo 失败: $Path" }
            return ($out -split '\s+' | Where-Object { $_ })
          }
          $want = $env:ARCH
          $wantToken = if ($want -eq 'x64') { 'x86_64' } else { 'arm64' }
          # node-pty 的 x64/arm64 预编译同包并存，glob 必须精确到目标架构目录
          $targets = @(
            'vendor/node/node',
            "node_modules/@koromix/koffi-darwin-$want/**/*.node",
            "node_modules/@img/sharp-darwin-$want/**/*.node",
            "node_modules/@img/sharp-libvips-darwin-$want/**/*.dylib",
            "node_modules/node-addon-require-builtin-darwin-$want/prebuilt/*.node",
            "node_modules/node-pty/prebuilds/darwin-$want/pty.node",
            "node_modules/node-pty/prebuilds/darwin-$want/spawn-helper"
          )
          $checked = 0
          foreach ($pattern in $targets) {
            Get-ChildItem $pattern -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $archs = Get-MachOArchs $_.FullName
              Write-Output ("{0,-72} [{1}]" -f $_.FullName, ($archs -join ' '))
              if ($archs -notcontains $wantToken) { throw "架构不符: $($_.FullName) = $($archs -join ' ') (期望 $wantToken)" }
              $checked++
            }
          }
          if ($checked -eq 0) { throw '未找到任何待校验的原生二进制' }
          Write-Output "OK: $checked 个原生二进制均为 $want"

      - name: Build (macOS x64, dmg + zip)
        run: npm run dist:mac -- ${{ env.DIST_SUFFIX }}
        timeout-minutes: 45
        env:
          # 无代码签名证书：禁止自动发现 Apple 证书，避免误签或构建失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 校验「打进 .app」的原生二进制（构建机上的 node_modules 不等于打包
      # 产物，防止原生模块静默漏出）。
      - name: Verify packaged app natives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-MachOArchs([string]$Path) {
            $out = (& lipo -archs $Path 2>$null) -join ' '
            if ($LASTEXITCODE -ne 0) { throw "lipo 失败: $Path" }
            return ($out -split '\s+' | Where-Object { $_ })
          }
          $want = $env:ARCH
          $wantToken = if ($want -eq 'x64') { 'x86_64' } else { 'arm64' }
          # electron-builder 解包目录：默认架构（arm64 腿，macos-14 原生）为
          # mac-arm64，非默认架构（x64 交叉腿）为 mac（getArchSuffix 规则）。
          # 实际产物是 <unpacked>/DSH Desktop.app 包。
          $bundle = Get-ChildItem "dist/$env:UNPACKED/*.app" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bundle) { throw "未找到 .app 包: dist/$env:UNPACKED" }
          $res = Join-Path $bundle.FullName 'Contents/Resources'
          $app = Join-Path $res 'app'
          # extraResources 落在 Contents/Resources/<to>，原生依赖在 app/node_modules
          $targets = @(
            "$res/node/node",
            "$app/node_modules/@koromix/koffi-darwin-$want/**/*.node",
            "$app/node_modules/@img/sharp-darwin-$want/**/*.node",
            "$app/node_modules/@img/sharp-libvips-darwin-$want/**/*.dylib",
            "$app/node_modules/node-addon-require-builtin-darwin-$want/prebuilt/*.node",
            "$app/node_modules/node-pty/prebuilds/darwin-$want/pty.node",
            "$app/node_modules/node-pty/prebuilds/darwin-$want/spawn-helper"
          )
          $checked = 0
          foreach ($pattern in $targets) {
            $files = @(Get-ChildItem $pattern -Recurse -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) { throw "打包产物缺少: $pattern" }
            foreach ($f in $files) {
              $archs = Get-MachOArchs $f.FullName
              Write-Output ("{0,-84} [{1}]" -f $f.FullName, ($archs -join ' '))
              if ($archs -notcontains $wantToken) { throw "架构不符: $($f.FullName) = $($archs -join ' ') (期望 $wantToken)" }
              $checked++
            }
          }
          Write-Output "OK: $checked 个打包内原生二进制均为 $want"
          # 顺手确认 extraResources 的 npm 目录也进了包
          if (-not (Test-Path "$res/npm")) {
            throw "打包产物缺少: $res/npm"
          }

      - name: Publish to GitHub Release
        shell: pwsh
        run: |
          $tag = $env:TAG
