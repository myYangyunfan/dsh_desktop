name: Release Build

# 双平台发布流水线（Windows x64/arm64 + macOS x64/arm64）：
#   · 推 v* tag（如 v0.4.0）时自动在云端构建 Windows 与 macOS 全部架构
#     安装包，一并上传到对应 GitHub Release；
#   · 手动触发（workflow_dispatch）可指定 tag、Windows 架构与 macOS 架构，
#     用于给已发布的版本补传某个平台/架构的安装包（例如给 v0.3.9 补 mac）。
# 用法：git tag v0.4.0 && git push origin v0.4.0（push gitee v0.4.0 同步 tag）
#
# 注意：GitHub Actions 的 job 级 if 无法引用 matrix context（解析期报
# "Unrecognized named-value: 'matrix'"），故不用 matrix 裁剪，而是拆成
# 四个显式 job（win-x64 / win-arm64 / mac-x64 / mac-arm64），各自用 if
# 按 inputs.arch / inputs.mac 决定是否运行。
#
# macOS 构建在 macos-14（Apple Silicon）runner 上交叉完成：
#   · arm64 腿：npm ci 装 darwin-arm64 原生变体，vendor/node 本地复制；
#   · x64 腿：npm ci 后由 install-darwin-x64-prebuilds.js 补装 darwin-x64
#     变体（koffi/sharp/libvips/narb），vendor/node 从 nodejs.org 下载
#     darwin-x64（Intel runner 已退役，不再依赖 macos-13/macos-15-intel）。
# macOS 产物未签名（无 Apple Developer 证书）：Apple Silicon 首次启动需
# 右键→打开，或 `xattr -dr com.apple.quarantine` 后正常打开。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到的 release tag（默认 v0.3.10）'
        required: false
        default: 'v0.3.10'
      arch:
        description: 'Windows 构建架构：both / x64 / arm64'
        required: false
        default: 'both'
      mac:
        description: 'macOS 构建：none / both / x64 / arm64'
        required: false
        default: 'none'

permissions:
  contents: write

jobs:
  build-x64:
    name: build-x64
    # 手动触发时按输入裁剪；推 tag 恒为双架构。
    if: >-
      github.event_name == 'push' ||
      inputs.arch == 'both' ||
      inputs.arch == 'x64'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dsh-desktop
    env:
      ARCH: x64
      UNPACKED: win-unpacked
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vendor/ 不进 git（.gitignore 排除），构建前现场生成：
      # x64：复制 runner 自带 Node 24 的 node.exe（ABI 与 npm ci 的原生模块匹配）。
      # npm CLI（纯 JS）两架构通用。
      - name: Fetch runtime (vendor/node + vendor/npm)
        shell: pwsh
        run: |
          npm run fetch-node
          npm run fetch-npm

      # 打包前校验所有运行时原生二进制确实是目标架构（PE Machine 字段）。
      # 误装 x64 变体会在 arm64 机器上加载失败，此步提前拦截。
      - name: Verify native binaries architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-MachineType([string]$Path) {
            $fs = [System.IO.File]::OpenRead($Path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              $m = $br.ReadUInt16()
            } finally {
              $br.Dispose(); $fs.Dispose()
            }
            switch ($m) {
              0x8664 { 'x64' }
              0xAA64 { 'arm64' }
              0x014C { 'x86' }
              default { '0x{0:X4}' -f $m }
            }
          }
          $want = $env:ARCH
          # node-pty 的 x64/arm64 预编译同包并存，glob 必须精确到目标架构目录，
          # 不能写 win32-*（否则会扫到对侧架构的 pty.node 导致误报）。
          $targets = @(
            'vendor/node/node.exe',
            "node_modules/@koromix/koffi-win32-$want/win32_$want/koffi.node",
            "node_modules/@img/sharp-win32-$want/lib/*.node",
            "node_modules/node-addon-require-builtin-win32-$want-msvc/prebuilt/*.node",
            "node_modules/node-pty/prebuilds/win32-$want/pty.node"
          )
          $checked = 0
          foreach ($pattern in $targets) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              $got = Get-MachineType $_.FullName
              Write-Output ("{0,-72} {1}" -f $_.FullName, $got)
              if ($got -ne $want) { throw "架构不符: $($_.FullName) = $got (期望 $want)" }
              $checked++
            }
          }
          if ($checked -eq 0) { throw '未找到任何待校验的原生二进制' }
          Write-Output "OK: $checked 个原生二进制均为 $want"

      - name: Build custom uninstaller
        shell: pwsh
        run: .\scripts\build-uninstaller.ps1

      - name: Build (x64, portable + nsis)
        run: npm run dist
        # 本地同款构建 5-8 分钟；公共 runner 更慢，30 分钟上限足够且失败时可取日志
        timeout-minutes: 30
        env:
          # 无代码签名证书：禁止自动发现 Windows 证书，避免构建机上有证书时报错或误签
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 校验「打进安装包」的原生二进制（构建机上的 node_modules 不等于打包产物：
      # 手工注入的可选依赖可能被 electron-builder 的依赖收集剔除，此步防止
      # 原生模块静默漏出）。
      - name: Verify packaged app natives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-MachineType([string]$Path) {
            $fs = [System.IO.File]::OpenRead($Path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              $m = $br.ReadUInt16()
            } finally {
              $br.Dispose(); $fs.Dispose()
            }
            switch ($m) {
              0x8664 { 'x64' }
              0xAA64 { 'arm64' }
              0x014C { 'x86' }
              default { '0x{0:X4}' -f $m }
            }
          }
          $want = $env:ARCH
          # electron-builder 解包目录：默认架构（构建机 x64 → x64 腿）为 win-unpacked，
          # 非默认架构（arm64 腿）为 win-arm64-unpacked（getArchSuffix 规则）。
          $unpacked = "dist/$env:UNPACKED"
          # extraResources 落在 resources/<to>（与 app/ 平级），原生依赖在 app/node_modules。
          $app = "$unpacked/resources/app"
          $targets = @(
            "$unpacked/resources/node/node.exe",
            "$app/node_modules/@koromix/koffi-win32-$want/win32_$want/koffi.node",
            "$app/node_modules/@img/sharp-win32-$want/lib/*.node",
            "$app/node_modules/node-addon-require-builtin-win32-$want-msvc/prebuilt/*.node",
            "$app/node_modules/node-pty/prebuilds/win32-$want/pty.node"
          )
          $checked = 0
          foreach ($pattern in $targets) {
            $files = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) { throw "打包产物缺少: $pattern" }
            foreach ($f in $files) {
              $got = Get-MachineType $f.FullName
              Write-Output ("{0,-84} {1}" -f $f.FullName, $got)
              if ($got -ne $want) { throw "架构不符: $($f.FullName) = $got (期望 $want)" }
              $checked++
            }
          }
          Write-Output "OK: $checked 个打包内原生二进制均为 $want"
          # 顺手确认 extraResources 的 npm 目录也进了包
          if (-not (Test-Path "$unpacked/resources/npm")) {
            throw "打包产物缺少: $unpacked/resources/npm"
          }

      # 最终安装包（portable / nsis）的入口 stub 架构记录到日志（stub 即使为 x86
      # 也能在 arm64 Windows 的 x86 仿真下安装运行，故不硬性断言）。
      - name: Report installer machine types
        shell: pwsh
        run: |
          function Get-MachineType([string]$Path) {
            $fs = [System.IO.File]::OpenRead($Path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              $m = $br.ReadUInt16()
            } finally {
              $br.Dispose(); $fs.Dispose()
            }
            switch ($m) {
              0x8664 { 'x64' }
              0xAA64 { 'arm64' }
              0x014C { 'x86' }
              default { '0x{0:X4}' -f $m }
            }
          }
          Get-ChildItem "dist/DSH-Desktop-*$env:ARCH*.exe" | ForEach-Object {
            Write-Output ("{0,-64} machine={1}" -f $_.Name, (Get-MachineType $_.FullName))
          }

      - name: Publish to GitHub Release
        shell: pwsh
        run: |
          $tag = $env:TAG
          # 双架构任务并行发布到同一 release：创建时容忍竞态（重复创建报错则重试）
          for ($i = 0; $i -lt 6; $i++) {
            gh release view $tag --json id 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
          $notes = @"
          # 更新要点：每次发版更新本段（面向当前版本），新版本发布时改为新版本要点
          ## ✨ v0.3.10 更新要点

          **新增**
          - 🧩 内置插件中枢 dsh-hub：插件更新引擎（一键更新/启停/卸载/自修复）+ 全局记忆（5 个 memory_* 工具，跨会话共享）+ graph-memory 一键挂载
          - 🍎 macOS 客户端自动更新（dmg/zip 下载安装，失败自动回滚）
          - 🔔 点击系统通知一键回到应用前台
          - 💰 余额增强：OpenCode Go 订阅额度、峰谷定价、未知模型回退修正
          - 🐳 桌面宠物默认关闭（设置 → 插件 → 管理 可一键开启）
          - 📌 侧边会话浮窗升级 v0.2.5（图标对齐/动画档位/输入框同款）

          **修复**
          - 更新后桌面图标消失（安装版缺失即补建）
          - 客户端更新下载完成不弹安装（待安装包优先弹窗）
          - WSL 托管后端探测失败自动回落本地（issue #54）
          - 更新回退失败静默卡住（弹错误框双出口）
          - 余额栏消失、左侧 Object 字样、计费回退不一致
          - 路径围栏本地 DoS、更新竞态、服务启动句柄泄漏

          **工程**
          - 插件管理：卸载/恢复 + 双源镜像更新（npm 官方 ↔ npmmirror、GitHub ↔ gh-proxy 自动切换）
          - profile bundle 装配自愈根治（无效登记隔离记录）
          - agent 预设更新保护（保留用户自定义预设）
          - 内置插件市场 zat-dsh-engine 移除；keyed slot 兼容
          - GitHub Actions 双平台四架构自动构建（win x64/arm64 + mac x64/arm64）

          ## 📦 怎么选安装包（平台 / 芯片对照）

          | 平台 | 芯片 | 文件 |
          | --- | --- | --- |
          | Windows 便携版（免安装） | x64 | DSH-Desktop-$($tag -replace '^v','')-portable-x64.exe |
          | Windows 便携版（免安装） | ARM64 | DSH-Desktop-$($tag -replace '^v','')-portable-arm64.exe |
          | Windows 安装版（含快捷方式） | x64 | DSH-Desktop-Setup-$($tag -replace '^v','')-x64.exe |
          | Windows 安装版（含快捷方式） | ARM64 | DSH-Desktop-Setup-$($tag -replace '^v','')-arm64.exe |
          | macOS（Intel） | x64 | DSH-Desktop-$($tag -replace '^v','')-macos-x64.dmg / .zip |
          | macOS（Apple Silicon） | ARM64 | DSH-Desktop-$($tag -replace '^v','')-macos-arm64.dmg / .zip |

          - Windows 用户：x64 设备选 x64 文件；ARM 设备（如 Surface Pro X）选 arm64 文件。
          - macOS 用户：Intel Mac 选 x64；Apple Silicon（M1/M2/M3/M4）选 arm64。将 App 拖入「应用程序」。
          - macOS 版未签名：首次打开请右键 → 打开，或执行 xattr -dr com.apple.quarantine "/Applications/DSH Desktop.app"。
          - 客户端自动更新：Windows 与 macOS 均支持（macOS 版未签名，首次打开请右键 → 打开，或执行 xattr -dr com.apple.quarantine）。
          "@
          gh release create $tag --title "DSH Desktop $tag" --notes $notes 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          gh release view $tag --json id --jq .id | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "无法创建或读取 release $tag" }
          $arch = $env:ARCH
          gh release upload $tag "dist/DSH-Desktop-*-$arch.exe" "dist/DSH-Desktop-*-$arch.exe.blockmap" --clobber
          Write-Output '=== release assets ==='
          gh release view $tag --json assets --jq '.assets[].name'
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}

  build-arm64:
    name: build-arm64
    if: >-
      github.event_name == 'push' ||
      inputs.arch == 'both' ||
      inputs.arch == 'arm64'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dsh-desktop
    env:
      ARCH: arm64
      UNPACKED: win-arm64-unpacked
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 交叉构建：x64 构建机补装 arm64 原生预编译包（koffi / sharp /
      # node-addon-require-builtin 运行时按 process.arch 动态选择平台包；
      # node-pty 的 win32-arm64 预编译已随主包分发，无需安装）。
      # 脚本自带 PE 架构校验，装错会直接失败。
      - name: Install ARM64 native prebuilds
        run: node scripts/install-arm64-prebuilds.js

      # vendor/ 不进 git（.gitignore 排除），构建前现场生成：
      # arm64：从 nodejs.org 下载同版本 win-arm64 node.exe（x64 构建机无法
      # 本地复制出 arm64 的 node.exe）。npm CLI（纯 JS）两架构通用。
      - name: Fetch runtime (vendor/node + vendor/npm)
        shell: pwsh
        run: |
          node scripts/fetch-node.js --arch=arm64
          npm run fetch-npm

      # 打包前校验所有运行时原生二进制确实是目标架构（PE Machine 字段）。
      # 误装 x64 变体会在 arm64 机器上加载失败，此步提前拦截。
      - name: Verify native binaries architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-MachineType([string]$Path) {
            $fs = [System.IO.File]::OpenRead($Path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              $m = $br.ReadUInt16()
            } finally {
              $br.Dispose(); $fs.Dispose()
            }
            switch ($m) {
              0x8664 { 'x64' }
              0xAA64 { 'arm64' }
              0x014C { 'x86' }
              default { '0x{0:X4}' -f $m }
            }
          }
          $want = $env:ARCH
          # node-pty 的 x64/arm64 预编译同包并存，glob 必须精确到目标架构目录，
          # 不能写 win32-*（否则会扫到对侧架构的 pty.node 导致误报）。
          $targets = @(
            'vendor/node/node.exe',
            "node_modules/@koromix/koffi-win32-$want/win32_$want/koffi.node",
            "node_modules/@img/sharp-win32-$want/lib/*.node",
            "node_modules/node-addon-require-builtin-win32-$want-msvc/prebuilt/*.node",
            "node_modules/node-pty/prebuilds/win32-$want/pty.node"
          )
          $checked = 0
          foreach ($pattern in $targets) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              $got = Get-MachineType $_.FullName
              Write-Output ("{0,-72} {1}" -f $_.FullName, $got)
              if ($got -ne $want) { throw "架构不符: $($_.FullName) = $got (期望 $want)" }
              $checked++
            }
          }
          if ($checked -eq 0) { throw '未找到任何待校验的原生二进制' }
          Write-Output "OK: $checked 个原生二进制均为 $want"

      - name: Build custom uninstaller
        shell: pwsh
        run: .\scripts\build-uninstaller.ps1

      - name: Build (arm64, portable + nsis)
        run: npm run dist:arm64
        # 本地同款构建 5-8 分钟；公共 runner 更慢，30 分钟上限足够且失败时可取日志
        timeout-minutes: 30
        env:
          # 无代码签名证书：禁止自动发现 Windows 证书，避免构建机上有证书时报错或误签
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 校验「打进安装包」的原生二进制（构建机上的 node_modules 不等于打包产物：
      # 手工注入的可选依赖可能被 electron-builder 的依赖收集剔除，此步防止
      # arm64 原生模块静默漏出）。
      - name: Verify packaged app natives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-MachineType([string]$Path) {
            $fs = [System.IO.File]::OpenRead($Path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $pe = $br.ReadInt32()
              $fs.Position = $pe + 4
              $m = $br.ReadUInt16()
            } finally {
              $br.Dispose(); $fs.Dispose()
            }
            switch ($m) {
              0x8664 { 'x64' }
              0xAA64 { 'arm64' }
              0x014C { 'x86' }
              default { '0x{0:X4}' -f $m }
            }
          }
          $want = $env:ARCH
          # electron-builder 解包目录：默认架构（构建机 x64 → x64 腿）为 win-unpacked，
          # 非默认架构（arm64 腿）为 win-arm64-unpacked（getArchSuffix 规则）。
          $unpacked = "dist/$env:UNPACKED"
          # extraResources 落在 resources/<to>（与 app/ 平级），原生依赖在 app/node_modules。
          $app = "$unpacked/resources/app"
          $targets = @(
            "$unpacked/resources/node/node.exe",
            "$app/node_modules/@koromix/koffi-win32-$want/win32_$want/koffi.node",
            "$app/node_modules/@img/sharp-win32-$want/lib/*.node",
            "$app/node_modules/node-addon-require-builtin-win32-$want-msvc/prebuilt/*.node",
            "$app/node_modules/node-pty/prebuilds/win32-$want/pty.node"
          )
          $checked = 0
          foreach ($pattern in $targets) {
            $files = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) { throw "打包产物缺少: $pattern" }
