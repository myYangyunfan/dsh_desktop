            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::版本混装防线：期望 ${EXPECTED}，但检出的 tauri.conf.json version=${ACTUAL}"
            exit 1
          fi
          echo "OK: tauri.conf.json version=${ACTUAL} == 期望 ${EXPECTED}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-tauri/src-tauri/target
          key: rust-mac-${{ hashFiles('dsh-tauri/src-tauri/Cargo.lock') }}

      - name: Install dsh-desktop dependencies
        run: cd dsh-desktop && npm ci --ignore-scripts

      - name: Download vendor node
        run: |
          mkdir -p dsh-desktop/vendor/node
          wget -q https://nodejs.org/dist/v24.15.0/node-v24.15.0-darwin-arm64.tar.gz
          tar -xzf node-v24.15.0-darwin-arm64.tar.gz
          cp node-v24.15.0-darwin-arm64/bin/node dsh-desktop/vendor/node/node
          chmod +x dsh-desktop/vendor/node/node

      - name: Download rc7 client packages
        run: |
          cd dsh-desktop
          dest="dist/win-unpacked/resources/app/node_modules/@deepseek-ai"
          mkdir -p "$dest"
          for pkg in dsh-client-web-react dsh-client-schema-form dsh-client-ui-primitives dsh-client-ui-slots dsh-client-ui-attachment dsh-client-ui-renderer; do
            full="@deepseek-ai/$pkg"
            echo "Downloading $full@0.1.0-rc.7 ..."
            tgz=$(npm pack "$full@0.1.0-rc.7" 2>&1 | tail -1)
            if [ ! -f "$tgz" ]; then echo "WARN: $full not found, skipping"; continue; fi
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mkdir -p "$dest/$pkg"
            cp -r "$tmp/package/"* "$dest/$pkg/"
            rm -f "$tgz"
          done
          echo "rc7 packages ready"

      - name: Stage payload (CI simplified)
        run: |
          set -e
          DEST="dsh-tauri/package-payload/dsh-desktop"
          mkdir -p "$DEST"
          cp dsh-desktop/*.js "$DEST/" 2>/dev/null || true
          cp dsh-desktop/package.json "$DEST/"
          cp -r dsh-desktop/scripts "$DEST/scripts"
          cp -r dsh-desktop/assets "$DEST/assets"
          mkdir -p "$DEST/vendor"
          cp -r dsh-desktop/vendor/node "$DEST/vendor/node"
          cp -r dsh-desktop/vendor/npm "$DEST/vendor/npm" 2>/dev/null || true
          # vendored 内核 tarball（随仓库提交）：0.5.7 起 boot 链 compat-pin 步骤
          # fail-closed 校验 vendor/dsh-kernel 与 kernel-pin 一致，缺目录即拒绝启动
          # （0.5.7 本地打包踩坑复盘：五平台 stage 清单均已补齐，勿再删）。
          cp -r dsh-desktop/vendor/dsh-kernel "$DEST/vendor/dsh-kernel"
          rm -rf "$DEST/node_modules"
          cp -r dsh-desktop/node_modules "$DEST/node_modules"
          rm -rf "$DEST/node_modules/electron" "$DEST/node_modules/electron-builder" "$DEST/node_modules/electron-winstaller" "$DEST/node_modules/@electron"
          # Codex/Claude 原生二进制（optional platform packages，~700MB 死重）：内核子代理
          # 适配器仅在真正拉起 Codex/Claude Code 进程时才解析这些 optional 二进制；import
          # 只读 JS 侧 metapackage。glob 精准命中各平台 variant（codex-win32-x64 /
          # codex-linux-x64 / claude-agent-sdk-darwin-arm64 ...），保留 metapackage 不断 import 图。
          rm -rf "$DEST"/node_modules/@openai/codex-* "$DEST"/node_modules/@anthropic-ai/claude-agent-sdk-*
          echo "Payload: $(du -sm "$DEST" | cut -f1)MB"

      - name: Build installer
        # --bundles dmg：同 Linux——覆盖 targets:["nsis"]，否则 macOS 不出 dmg
        run: cd dsh-tauri && npx --yes @tauri-apps/cli@latest build --config src-tauri/src/app/tauri.conf.json --target aarch64-apple-darwin --bundles dmg

      - name: Verify ad-hoc signature (arm64 内核强制代码签名)
        # v0.5.0 事故复盘：Tauri v2 在未配置 signingIdentity 且无 APPLE_CERTIFICATE
        # 时【完全跳过】codesign——.app 无 bundle 级密封（_CodeSignature 缺失），
        # 仅主二进制带 rustc/ld 链接期 ad-hoc 签名。Sequoia 起 Gatekeeper 对
        # quarantine 的此类应用直接报「已损坏」，xattr -cr 救不回。
        # 修复：tauri.conf.json 已显式 signingIdentity:"-"（ad-hoc），由 Tauri
        # 在打 DMG 前按由内向外顺序正规签名；本步骤验证签名真实存在，失败即
        # 回退显式重签并重打 DMG——绝不再发出无签名 mac 包。
        run: |
          set -e
          # 注意：Tauri 打完 DMG 会「Cleaning」删掉 bundle/macos/ 下的 .app
          # （v0.5.1 首跑实测：验已被清理的路径必假失败）——改为挂载 DMG 验
          # 内层 app；失败才解包重签重打。
          DMG_DIR="dsh-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          DMG="$(ls "$DMG_DIR"/*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::未找到 DMG 产物（构建失败？）"; ls -la "$DMG_DIR" || true; exit 1; }
          MNT="$(mktemp -d)/dshd"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          APP="$MNT/DSH Desktop.app"
          echo "=== codesign -dv（DMG 内层）==="
          codesign -dv "$APP" 2>&1 || true
          if codesign --verify --deep --strict "$APP"; then
            echo "OK: DMG 内 app bundle 签名有效（ad-hoc 密封完整）"
          else
            echo "::warning::签名缺失/无效——解包重签并重打 DMG"
            WORK="$(mktemp -d)"
            cp -R "$APP" "$WORK/DSH Desktop.app"
            hdiutil detach "$MNT" -quiet || true
            xattr -cr "$WORK/DSH Desktop.app" || true
            codesign --force --deep --sign - "$WORK/DSH Desktop.app"
            codesign --verify --deep --strict "$WORK/DSH Desktop.app"
            rm -f "$DMG_DIR"/*.dmg
            hdiutil create -volname "DSH Desktop" -srcfolder "$WORK/DSH Desktop.app" -ov -format UDZO "$DMG_DIR/resigned.dmg"
            MNT="$(mktemp -d)/dshd2"
            hdiutil attach "$DMG_DIR/resigned.dmg" -mountpoint "$MNT" -nobrowse -readonly -quiet
            APP="$MNT/DSH Desktop.app"
          fi
          echo "=== spctl 评估（ad-hoc 必然 rejected，仅留痕）==="
          spctl -a -t execute "$APP" 2>&1 || true
          hdiutil detach "$MNT" -quiet || true

      - name: Rename artifacts (assert version + size)
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          BUNDLE=dsh-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle
          # 版本混装防线③（v0.5.0 事故的直接防线）：DMG 内 Info.plist 的
          # CFBundleShortVersionString 必须等于期望版本。.app 已被 Tauri 打
          # DMG 后清理——挂载 DMG 读内层 plist（与签名校验步骤同款姿势）。
          DMG="$(ls "$BUNDLE"/dmg/*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::未找到 DMG 产物"; exit 1; }
          MNT="$(mktemp -d)/dshd"
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          plist_ver=$(plutil -extract CFBundleShortVersionString raw "$MNT/DSH Desktop.app/Contents/Info.plist")
          hdiutil detach "$MNT" -quiet || true
          echo "Info.plist CFBundleShortVersionString = ${plist_ver}"
          if [ "$plist_ver" != "$VERSION" ]; then
            echo "::error::DMG 内 Info.plist 版本 ${plist_ver} != 期望 ${VERSION}（版本混装）"
            exit 1
          fi
          ls -la "$BUNDLE/dmg" || true
          shopt -s nullglob
          dmgs=( "$BUNDLE"/dmg/*_"${VERSION}"_*.dmg )
          # 签名回退路径重打的 DMG 文件名不带版本（resigned.dmg）——内容版本
          # 已由上方 Info.plist 断言覆盖，允许兜底匹配
          if [ ${#dmgs[@]} -eq 0 ] && [ -f "$BUNDLE/dmg/resigned.dmg" ]; then
            dmgs=( "$BUNDLE/dmg/resigned.dmg" )
          fi
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::未找到 *_${VERSION}_*.dmg——DMG 文件名版本与期望不符（见上方目录清单）"
            exit 1
          fi
          cp "${dmgs[0]}" "DSH-Desktop-${VERSION}-macos-arm64.dmg"
          # BSD stat（macOS）无 -c——用 wc -c 全平台可移植（此行是 v0.5.1
          # 第三跑才暴露的陈年坑：此前从未活到这一步）。
          size=$(wc -c < "DSH-Desktop-${VERSION}-macos-arm64.dmg" | tr -d ' ')
          if [ "$size" -lt 52428800 ]; then
            echo "::error::DMG 体积异常（${size} 字节 < 50MB；v0.5.0 参考：~117MB）"
            exit 1
          fi
          echo "OK: DSH-Desktop-${VERSION}-macos-arm64.dmg ($size bytes)"
          ls -la DSH-Desktop-*-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: DSH-Desktop-*-macos-arm64.dmg
          if-no-files-found: warn

  publish:
    name: Publish Release
    needs: [build-windows, build-windows-arm64, build-portable, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-portable.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows-arm64.result == 'success')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # 全部发布产物（含便携版 zip）；排除中间产物（win-x64-bin 里的裸 exe，
          # 它只是便携版 job 的原料，不进 Release）
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) ! -name "dsh-tauri-app.exe" -exec cp {} release-assets/ \; || true
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::没有任何构建产物被收集（所有 build job 均失败？）——中止发布"
            exit 1
          fi

      - name: Generate sha256 sidecars
        # 自动更新强制校验链配套：客户端壳侧下载平台资产后强制校验同名
        # .sha256 边车（解析规则：首段 64 位小写 hex）。边车在 publish 统一
        # 生成而非各 build job 生成——单点产出保证「一个主资产恰好一个边车」，
        # 且 dispatch 补传/重建资产时边车必然随新内容重建。
        # 格式与 sha256sum 原生输出一致（<hex><两空格><文件名>），壳侧/verify
        # 脚本均只取首段 hex，文件名尾注向后兼容可省略。
        # 注：本步骤只在 ubuntu runner 上跑（sha256sum GNU 版），mac build job
        # 不涉及——规避 BSD 工具链坑（stat -c 前车之鉴）。
        run: |
          set -euo pipefail
          cd release-assets
          main_count=0
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            main_count=$((main_count + 1))
            sha256sum "$f" > "$f.sha256"
            hash=$(cut -d' ' -f1 "$f.sha256")
            if ! echo "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::边车格式异常（首段不是 64 位小写 hex）: $f.sha256"
              exit 1
            fi
            echo "边车: $f.sha256  hash=$hash"
          done
          side_count=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          if [ "$side_count" -ne "$main_count" ]; then
            echo "::error::边车数量 ${side_count} != 主资产数量 ${main_count}"
            exit 1
          fi
          echo "OK: ${side_count}/${main_count} 个主资产均已生成 sha256 边车"

      - name: Resolve release tag/version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            tag='${{ github.ref_name }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify assets (版本一致 + 体积下限 + 边车齐全)
        # 版本混装防线④（最后一道闸）：每个资产文件名必须内嵌期望版本号、
        # 体积必须 >50MB。任一不满足即拒绝发布——上游 job 有 continue-on-error，
        # 不能全信，publish 是资产出仓前的总闸。
        # 边车（*.sha256）例外分支：不适用 50MB 下限（本身就是百来字节），
        # 改为校验 ①主资产存在 ②内容首段 64 位小写 hex；文件名版本检查对
        # 边车同样生效（边车名=主资产名+后缀，天然含版本）。
        run: |
          set -euo pipefail
          VERSION='${{ steps.ver.outputs.version }}'
          echo "=== 产物清单（期望版本 ${VERSION}）==="
          fail=0
          for f in release-assets/*; do
            name=$(basename "$f")
            case "$name" in
              *.sha256)
                main="${name%.sha256}"
                if [ ! -f "release-assets/$main" ]; then
                  echo "::error::边车没有对应主资产: $name"; fail=1
                fi
                if ! head -c 200 "$f" | grep -Eq '^[0-9a-f]{64}([[:space:]]|$)'; then
                  echo "::error::边车格式坏（首段非 64 位小写 hex）: $name"; fail=1
                fi
                ;;
              esac
            case "$name" in
              *"$VERSION"*) ;;
              *) echo "::error::资产文件名未包含期望版本 ${VERSION}: $name（版本混装？拒绝发布）"; fail=1 ;;
            esac
            size=$(stat -c%s "$f")
            case "$name" in
              *.sha256) ;; # 边车不适用 50MB 下限
              *)
                if [ "$size" -lt 52428800 ]; then
                  echo "::error::资产体积异常（<50MB）: $name（${size} 字节）"
                  fail=1
                fi ;;
            esac
            printf '%-52s %12d bytes\n' "$name" "$size"
          done
          main_n=$(find release-assets -maxdepth 1 -type f ! -name '*.sha256' | wc -l)
          side_n=$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)
          if [ "$main_n" -ne "$side_n" ]; then
            echo "::error::边车数量 ${side_n} != 主资产数量 ${main_n}——每个主资产必须有边车（自动更新校验链）"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: ${main_n} 个主资产 + ${side_n} 个边车全部通过版本/体积/边车校验"

      - name: Generate release notes
        run: |
          TAG='${{ steps.ver.outputs.tag }}'
          VERSION='${{ steps.ver.outputs.version }}'
          cat > release-notes.md << EOF
          # DSH Desktop ${VERSION} — 全平台

          > 覆盖 v0.6.1 + v0.6.2：① 单项根治「多模态模型说我发不了图片」；② 内核输入区
          > （composer）换代漂移整族修复——9 个插件静默失效全部迁移修复；③ 插件同步
          > 把残留依赖树整树分发导致的卡死根治；④ 历史对话完整回溯与「吞消息」根治。

          ## ✨ 新功能

          **模型卡「支持图片输入」勾选**
          设置 → 模型管理，每个模型一行一个勾选框：勾上 = 显式声明支持图片，发图不再被
          「当前模型不支持图片」拒绝；取消 = 恢复纯文本。适合「模型本身支持视觉、但接口
          没声明」的场景（第三方中转 / 开源模型常见）。从「获取模型」目录挑选模型时会
          自动带上接口自报的图片能力。视频暂不提供勾选：当前内核协议只支持 text / image。

          **历史对话完整回溯（v0.6.1）**
          - 历史加载每页 50 → 200 条；滚到聊天顶部自动翻页加载更早记录；
          - 根治「历史只显示约三分之一」「翻到头早期对话仍缺失」——跨页断头自动续读。

          **「编辑并回退」重做（v0.6.2）**
          消息悬停「编辑并回退」：从任意一条历史消息处分叉新会话、预填原文重发，旧会话
          原样保留。此功能在输入区换代后一度完全失效，本版修复并实测通过。

          ## 🛠 修复

          **「吞消息」根治（v0.6.1）**
          偶发「消息发出去了、界面却不显示」：现在遇到装配异常自动从持久化完整历史窗口
          安全重建，不再丢消息；极端情况输出 [dsh-assembly-resilience] 前缀日志可取证。

          **输入区换代适配（9 个插件静默失效全修，v0.6.2）**
          编辑并回退 / 输入历史 ↑ 回溯 / 拖拽文件到对话 / 粘贴图片发送 / 对话导航条 /
          对话界面增强 / 长消息折叠 / 峰谷价格卫士 / 识图插件草稿被覆盖——全部修复，
          每处均做了修复前后交叉验证。

          **配套插件同步卡死（v0.6.2）**
          同步会把开发机残留依赖树（上万个文件）整树拷贝、卡数分钟。现在只分发随包正件，
          同步从分钟级回到秒级。

          ## 安装包

          | 平台 | 格式 |
          |------|------|
          | Windows x64 | 安装包 DSH-Desktop-Setup-${VERSION}-win-x64.exe |
          | Windows x64 | 便携版 DSH-Desktop-Portable-${VERSION}-win-x64.zip（解压即用，数据存 exe 旁 data/ 目录） |
          | Windows ARM64 | 实验性安装包 DSH-Desktop-Setup-${VERSION}-win-arm64.exe |
          | Linux x64 | AppImage / .deb |
          | macOS ARM64 | .dmg |

          ## 升级说明

          1. 完全退出当前 DSH Desktop（托盘右键 → 退出）
          2. 下载对应平台安装包并运行（覆盖安装，装回原目录，数据不丢失）
          3. 首次启动自动对齐补丁与插件

          ## 详细更新日志

          见 [CHANGELOG.md](https://github.com/myYangyunfan/dsh_desktop/blob/main/dsh-tauri/CHANGELOG.md)
          EOF

      - name: Upload assets to Release
        # 上传纪律：
        #  1) release 不存在时才创建；已存在时绝不触碰 title/body/prerelease/draft
        #     ——此前 softprops/action-gh-release 每次运行都会把 Pre-release 和
        #     预览版标题冲掉（draft:false + prerelease:false 写死）。
        #  2) 同名资产先 delete-asset 再上传（而非 fail-fast）：「给已发布版本
        #     补传/重建资产」正是 workflow_dispatch 的第一用途，fail-fast 会让
        #     该用途无法执行；显式删除后重传是幂等重建，且下一步会逐个核对
        #     存在性与大小，不留旧内容残影、不会出现重复资产。
          #  3) 上传失败不吞错（旧版 || echo WARN 会静默丢资产）。
          #  4) 循环遍历 release-assets/* 全部文件——.sha256 边车与主资产
          #     同目录，天然走同一套 delete-then-upload 幂等路径（重跑 release
          #     job 时边车同样删后传，不会残留旧哈希）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # publish job 无 checkout（无 git 上下文）——gh 必须显式知道仓库，
          # 否则 create 走「从本地 git 推断」路径直接 fatal（v0.5.1 第三跑
          # 实证：六资产校验全过、create 崩在 not a git repository）。
          GH_REPO: myYangyunfan/dsh_desktop
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 不存在——创建（仅此一次触碰 release 元数据）"
            # 不带 --prerelease：更新器的 /releases/latest 端点跳过 prerelease，
            # 出生即 prerelease 意味着更新检查永远看不到新版本（直到手动翻
            # latest——v0.5.7 首发即踩，「自动更新一直不生效」的全局根因之一）。
            # 正式 release 自动成为 latest，更新链路即刻可见。
            gh release create "$TAG" --title "DSH Desktop $TAG" --notes-file release-notes.md
          fi
          for f in release-assets/*; do
            name=$(basename "$f")
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "删除已存在的同名资产: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
            echo "上传: $f"
            gh release upload "$TAG" "$f"
          done

      - name: Verify uploaded assets
        # 上传后校验（资产去重纪律的收口）：每个资产都在 release 上存在、
        # 大小与本地一致且非零。另列出 release 全部资产供人工核对重复。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: myYangyunfan/dsh_desktop
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"' > remote-assets.tsv
          echo "=== release 现有资产（共 $(wc -l < remote-assets.tsv) 个）==="
          cat remote-assets.tsv
          for f in release-assets/*; do
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            remote=$(awk -F'\t' -v n="$name" '$1==n {print $2}' remote-assets.tsv)
            if [ -z "$remote" ]; then
              echo "::error::资产未出现在 release 上: $name"
              exit 1
            fi
            if [ "$remote" != "$size" ]; then
              echo "::error::资产大小不一致: $name local=$size remote=$remote"
              exit 1
            fi
            echo "OK: $name ($size bytes)"
          done
          # 边车收口：远端边车数量必须与本地一致（缺失=上传被吞或重名被删）
          remote_side=$(awk -F'\t' '$1 ~ /\.sha256$/ {n++} END {print n+0}' remote-assets.tsv)
          local_side=$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)
          if [ "$remote_side" -ne "$local_side" ]; then
            echo "::error::远端边车数量 ${remote_side} != 本地边车数量 ${local_side}——自动更新校验链不完整"
            exit 1
          fi
          echo "OK: ${remote_side} 个边车已随主资产上传并核对"
          echo "=== 全部资产上传并核对通过 ==="

  # ── Gitee 镜像（自动更新第二源）─────────────────────────────────────────
  # 客户端壳侧更新器轮询 GitHub + Gitee 双源 releases/latest，国内用户主要打
  # Gitee。镜像范围=GitHub release 全部资产（含 .sha256 边车），约束与策略：
  #   · Gitee 单附件上限 100MB（104857600 字节）——超限主资产（AppImage/deb/
  #     dmg）跳过并告警（壳侧会回落 GitHub 源下载，属预期）；边车均为小文件
  #     不受限，必须全部镜像。
  #   · Gitee v5 API 无「删除单个附件」端点（重复上传会产生重复条目），幂等
  #     策略：同名同大小→跳过；同名不同大小→删除整个 Gitee release 重建
  #     （对齐 GitHub 侧 delete-then-upload 纪律；dispatch 重建资产后重跑
  #     本 job 即完成镜像同步）。
  #   · Gitee 侧自动附带 tag 源码包（v*.zip / v*.tar.gz），属平台行为不算缺失。
  #   · 依赖仓库 secret：GITEE_TOKEN（gitee.com 私人令牌，需 projects 权限）。
  mirror-gitee:
    name: Mirror Release to Gitee
    needs: [publish]
    if: always() && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_REPO: myYangyunfan/dsh_desktop
      GITEE_API: https://gitee.com/api/v5
      GITEE_REPO: my-yang-yunfan/dsh_desktop
      GITEE_FILE_LIMIT: '83886080'
    steps:
      - name: Resolve release tag/version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            tag='${{ github.ref_name }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Guard GITEE_TOKEN
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 secret GITEE_TOKEN——请在 仓库 Settings → Secrets and variables → Actions 配置 gitee.com 私人令牌（需 projects 权限），然后重跑本 job"
            exit 1
          fi
          echo "GITEE_TOKEN 已配置"

      - name: Checkout (for tag push fallback)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
          fetch-depth: 1

      - name: Ensure tag exists on Gitee
        # Gitee 建_release 依赖 tag 已存在。常见情形是 Gitee 仓库已通过镜像同步
        # 拿到 tag（直接跳过 push）；否则用 GITEE_TOKEN 作 HTTPS 密码浅取 tag
        # 推过去；再不行给出人工路径（runbook §自动更新配套）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          # 本地建立 tag ref（checkout 检出的是 commit，未必带 tag 引用）
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}" || {
            echo "::error::无法从 GitHub 取 tag ${TAG}（tag 不存在？）"; exit 1; }
          if curl -sf "${GITEE_API}/repos/${GITEE_REPO}/tags?access_token=${GITEE_TOKEN}&per_page=100" \
               | jq -e --arg t "$TAG" '[.[].name] | index($t)' >/dev/null; then
            echo "Gitee 已有 tag ${TAG}（镜像同步或此前推送）——跳过 push"
            exit 0
          fi
          echo "Gitee 缺 tag ${TAG}——通过 HTTPS + token 推送"
          LOGIN=$(curl -sf "${GITEE_API}/user?access_token=${GITEE_TOKEN}" | jq -r '.login')
          [ -n "$LOGIN" ] && [ "$LOGIN" != "null" ] || { echo "::error::GITEE_TOKEN 无法换取用户名（/user 失败）"; exit 1; }
          git remote add gitee "https://${LOGIN}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          # remote URL 含 token：push --quiet 且失败时先脱敏再回显
          if ! git push --quiet gitee "refs/tags/${TAG}" 2>/tmp/push.err; then
            echo "::error::推送 tag 到 Gitee 失败（Gitee 仓库可能落后于 GitHub，浅推 tag 缺上游对象）。"
            echo "人工处理：Gitee 仓库管理→强制同步，或本地 git push gitee ${TAG} 后重跑本 job"
            cat /tmp/push.err | sed "s/${GITEE_TOKEN}/***/g" || true
            exit 1
          fi
          echo "OK: tag ${TAG} 已推送到 Gitee"

      - name: Download GitHub release assets
        # 从 GitHub release 下载全部资产作为镜像源（含 .sha256 边车）——
        # 以上传核对过的远端为准，而非本地构建产物。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          mkdir -p gh-assets
          gh release download "$TAG" --dir gh-assets --clobber
          echo "=== 待镜像资产 ==="
          ls -la gh-assets

      - name: Get-or-rebuild Gitee release
        # 幂等核心：同名同大小→复用现有 release；任何同名不同大小（dispatch
        # 重建过资产）→ 删整个 Gitee release 重建（v5 无删单附件 API）；
        # 不存在→按 GitHub 元数据创建。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          # GitHub 侧元数据（镜像以 GitHub 为准源）
          gh release view "$TAG" --json name,body,isPrerelease > gh-meta.json
          NAME=$(jq -r '.name' gh-meta.json)
          BODY=$(jq -r '.body' gh-meta.json)
          PRE=$(jq -r '.isPrerelease' gh-meta.json)
          http=$(curl -s -o gitee-rel.json -w '%{http_code}' "${GITEE_API}/repos/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")
          create_release() {
            curl -sf -X POST "${GITEE_API}/repos/${GITEE_REPO}/releases" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=${NAME}" \
              --data-urlencode "body=${BODY}" \
              --data-urlencode "prerelease=${PRE}" \
              --data-urlencode "target_commitish=${TAG}" > gitee-rel.json
          }
          # Gitee 对不存在的 release 返回 200 + 空(null) 而非 404（实测），
          # 以响应体能否取到 .id 判定存在性，勿只依赖 HTTP 状态码。
          EXISTS_ID=$(jq -r 'if type == "object" then (.id // empty) else empty end' gitee-rel.json 2>/dev/null || true)
          if [ "$http" = "200" ] && [ -n "$EXISTS_ID" ]; then
            REL_ID="$EXISTS_ID"
            echo "Gitee release ${TAG} 已存在（id=${REL_ID}）——核对资产漂移"
            drift=0
            while IFS=$'\t' read -r name size; do
              remote=$(jq -r --arg n "$name" '.assets[]? | select(.name==$n) | .size' gitee-rel.json | head -1)
              if [ -n "$remote" ] && [ "$remote" != "null" ] && [ "$remote" != "$size" ]; then
                echo "漂移: $name 本地=${size} Gitee=${remote}（同名不同大小）"
                drift=1
              fi
            done < <(cd gh-assets && for f in *; do printf '%s\t%s\n' "$f" "$(stat -c%s "$f")"; done)
            if [ "$drift" -eq 1 ]; then
              echo "同名资产内容不一致——删除整个 Gitee release 重建（v5 无删单附件端点）"
              curl -sf -X DELETE "${GITEE_API}/repos/${GITEE_REPO}/releases/${REL_ID}?access_token=${GITEE_TOKEN}"
              create_release
            fi
          elif [ "$http" = "200" ] || [ "$http" = "404" ]; then
            echo "Gitee release ${TAG} 不存在（http=${http}）——按 GitHub 元数据创建"
            create_release
          else
            echo "::error::查询 Gitee release 失败 http=${http}"; cat gitee-rel.json; exit 1
          fi
          REL_ID=$(jq -r '.id' gitee-rel.json)
          [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ] || { echo "::error::未取得 Gitee release id"; cat gitee-rel.json; exit 1; }
          echo "REL_ID=$REL_ID" >> "$GITHUB_ENV"
          echo "OK: Gitee release id=${REL_ID}"

      - name: Upload assets to Gitee
        # 上传缺失资产；>100MB 跳过（壳侧回落 GitHub 源，预期行为）；
        # 已存在同名同大小跳过（幂等）。边车是小文件，永远在镜像范围内。
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          REL_ID='${{ env.REL_ID }}'
          LIMIT=${GITEE_FILE_LIMIT}
          # 刷新远端资产清单（rebuild 后为空，复用时为现状）
          curl -sf "${GITEE_API}/repos/${GITEE_REPO}/releases/tags/${{ steps.ver.outputs.tag }}?access_token=${GITEE_TOKEN}" > gitee-now.json
          # 上传顺序：win-x64 安装包优先（CN 用户主下载资产），其后其余资产。
          # 单资产最终失败不再中断整个镜像——上一版 arm64 exe 连败两次即 exit，
          # win-x64 安装包永远轮不到上传（Gitee 源全用户更新失效的实爆）。
          # 收口由下方 Verify mirrored assets 兜底：缺失/大小不符仍会拒发。
          declare -A SEEN
          FAIL=0
          upload_one() {
            local f="$1" name size remote attempt
            name=$(basename "$f")
            if [ -n "${SEEN[$name]:-}" ]; then return 0; fi
            SEEN[$name]=1
            size=$(stat -c%s "$f")
            # Gitee v5 资产对象无 size 字段（只有 name + browser_download_url），
            # 存在性按 name 判定；大小由 sha256 边车兜底。
            remote=$(jq -r --arg n "$name" '.assets[]? | select(.name==$n) | .name' gitee-now.json | head -1)
            if [ -n "$remote" ] && [ "$remote" != "null" ]; then
              echo "跳过（已镜像）: $name"
              return 0
            fi
            if [ "$size" -gt "$LIMIT" ]; then
              echo "::warning::跳过超 Gitee 限制的资产: $name（${size} 字节；壳侧自动回落 GitHub 源下载）"
              return 0
            fi
            echo "上传到 Gitee: $name（${size} 字节）"
            # Gitee 上传 API 大文件慢：单文件 10 分钟上限 + 4 次退避重试
            #（20/40/60s——v0.5.7 首发实测单文件偶发连败两次即退）。
            for attempt in 1 2 3 4; do
              if curl -sf --max-time 600 -X POST "${GITEE_API}/repos/${GITEE_REPO}/releases/${REL_ID}/attach_files?access_token=${GITEE_TOKEN}" \
                -F "file=@${f}" > /dev/null; then
                echo "  上传成功: $name（第 ${attempt} 次）"
                return 0
              fi
              echo "::warning::上传失败（第 ${attempt} 次）: $name"
              if [ "$attempt" -eq 4 ]; then return 1; fi
              sleep $((attempt * 20))
            done
            return 1
          }
          for f in gh-assets/*-win-x64.exe gh-assets/*; do
            if [ -f "$f" ]; then upload_one "$f" || FAIL=1; fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::一个或多个资产最终上传失败（详见上方告警）——Verify 步骤将复核并拒绝发布"
            exit 1
          fi

      - name: Verify mirrored assets
        # 镜像收口：重查 Gitee release，每个 ≤100MB 的源资产（含全部边车）
        # 必须存在且大小与 GitHub 侧逐字节一致。
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          LIMIT=${GITEE_FILE_LIMIT}
          curl -sf "${GITEE_API}/repos/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" > gitee-final.json
          echo "=== Gitee 镜像核对（tag ${TAG}）==="
          fail=0
          mirrored=0
          for f in gh-assets/*; do
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$LIMIT" ]; then
              printf '%-52s %12d bytes  [超限跳过，预期缺失]\n' "$name" "$size"
              continue
            fi
            remote=$(jq -r --arg n "$name" '.assets[]? | select(.name==$n) | .name' gitee-final.json | head -1)
            if [ -z "$remote" ] || [ "$remote" = "null" ]; then
              echo "::error::Gitee 缺失资产: $name（${size} 字节，未超限不应缺失）"
              fail=1
              continue
            fi
            printf '%-52s %12d bytes  OK\n' "$name" "$size"
            mirrored=$((mirrored + 1))
          done
          # 边车必须全部在镜像内（小文件永不受限）
          side_total=$(find gh-assets -maxdepth 1 -name '*.sha256' | wc -l)
          side_mirrored=$(jq -r '[.assets[]?.name | select(endswith(".sha256"))] | length' gitee-final.json)
          if [ "$side_mirrored" -lt "$side_total" ]; then
            echo "::error::Gitee 边车不全：${side_mirrored}/${side_total}（边车是小文件，缺=镜像链路故障）"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: ${mirrored} 个资产镜像一致（含 ${side_mirrored} 个边车；>100MB 主资产按预期跳过）"
