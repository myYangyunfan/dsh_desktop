name: Tauri Release

# Tauri 版三平台发布流水线：
#   推 v* tag（如 v0.5.0）→ 云端构建 Windows/Linux/macOS 安装包 → 上传 Release
#   手动触发（workflow_dispatch）→ 指定版本号补传
#
# 与旧 Electron release.yml 的区别：走 Tauri CLI（非 electron-builder），
# 产物为 NSIS/AppImage/dmg + Windows 便携版 zip；依赖 stage-payload.sh 组装内核 payload。
#
# 产物命名（统一 DSH-Desktop-[类型]-[版本]-[平台]-[架构] 格式，对齐 Electron 版历史命名）：
#   Windows x64  NSIS   → DSH-Desktop-Setup-<ver>-win-x64.exe
#   Windows x64  便携版 → DSH-Desktop-Portable-<ver>-win-x64.zip（解压即用，数据存 exe 旁 data/）
#   Windows ARM64 NSIS  → DSH-Desktop-Setup-<ver>-win-arm64.exe（实验性，continue-on-error）
#   macOS ARM64  dmg    → DSH-Desktop-<ver>-macos-arm64.dmg
#   Linux x64    AppImage → DSH-Desktop-<ver>-linux-x64.AppImage
#   Linux x64    deb    → dsh-desktop_<ver>_amd64.deb（deb 标准命名）
#   自动更新校验边车 → 每个主资产附带 <主资产名>.sha256（publish job 统一生成，
#   内容=sha256sum 格式「<64位小写hex>  <文件名>」，壳侧更新器解析取首段 hex；
#   Gitee 镜像 job 一并镜像，镜像后由 verify-update-sources.mjs 做双源核验）
#
# 用法：git tag v0.5.1 && git push origin v0.5.1   ← 正式发版唯一入口
#        手动 dispatch 仅用于给【已存在的 tag】补传/重建资产：流水线会强制
#        checkout refs/tags/v<版本>，绝不从分支头构建——v0.5.0 事故中分支头
#        已 bump 到 0.5.1，从分支头重建产出了「文件名 0.5.0 / 内嵌 0.5.1」
#        的版本混装资产。版本一致性的四道闸（逐级收口）：
#          ① checkout 强制 tag ref（本文件每个 build job）
#          ② tauri.conf.json version == tag 版本 fail-fast（每个 build job）
#          ③ 产物文件名内嵌版本断言（NSIS/deb/AppImage/dmg + Info.plist）
#          ④ publish 汇总断言：所有资产文件名含版本 + 体积 >50MB + 上传核对
#        完整发版步骤见 .github/RELEASE_RUNBOOK.md

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '目标 release tag（如 v0.5.1；tag 必须已存在——将强制检出该 tag 构建）'
        required: true

permissions:
  contents: write

# 同一 ref 的发布构建串行排队、不互相取消（发布中途中砍产物得不偿失）
concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Resolve version and ref
        # workflow_dispatch 补传必须构建 tag 对应提交——分支头往往已 bump 到
        # 下一版本，从分支头重建曾产出「文件名 v0.5.0、Info.plist 0.5.1」的
        # 混装资产。tag push 时 github.ref 本就指向 tag，行为不变。
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            tag='${{ github.ref_name }}'
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}

      - name: Assert tauri.conf.json version == tag version
        # 版本一致性第二道闸：安装包内嵌版本唯一来源是 tauri.conf.json 的
        # version 字段，与期望不符立即 fail-fast。
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.ver.outputs.version }}'
          ACTUAL=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dsh-tauri/src-tauri/src/app/tauri.conf.json | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::无法从 dsh-tauri/src-tauri/src/app/tauri.conf.json 解析 version 字段"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::版本混装防线：期望 ${EXPECTED}，但检出的 tauri.conf.json version=${ACTUAL}——请在 tag 对应提交上修正版本后重打 tag，或更正 dispatch 输入"
            exit 1
          fi
          echo "OK: tauri.conf.json version=${ACTUAL} == 期望 ${EXPECTED}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-tauri/src-tauri/target
          key: rust-win-${{ hashFiles('dsh-tauri/src-tauri/Cargo.lock') }}
          restore-keys: rust-win-

      - name: Install dsh-desktop dependencies
        run: cd dsh-desktop && npm ci --ignore-scripts
        shell: pwsh

      - name: Download vendor node
        run: |
          mkdir -Force dsh-desktop\vendor\node | Out-Null
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.15.0/win-x64/node.exe' -OutFile dsh-desktop\vendor\node\node.exe
        shell: pwsh

      - name: Download vendor npm
        run: |
          $tmp = "$env:TEMP\npm-pkg"
          mkdir -Force $tmp | Out-Null
          Invoke-WebRequest -Uri 'https://registry.npmmirror.com/npm/-/npm-10.9.2.tgz' -OutFile "$tmp\npm.tgz"
          tar -xzf "$tmp\npm.tgz" -C $tmp
          mkdir -Force dsh-desktop\vendor\npm | Out-Null
          Copy-Item "$tmp\package\*" dsh-desktop\vendor\npm\ -Recurse -Force
        shell: pwsh

      - name: Download rc7 client packages (for compat)
        run: |
          set -e
          cd dsh-desktop
          rc7_root="dist/win-unpacked/resources/app/node_modules"
          mkdir -p "$rc7_root"
          # PD1 对账（v0.5.2 复盘）：6 个 rc.7 客户端包之外，build-client-compat.mjs
          # 的闭包 BFS 还需要 web-react 的 use-sync-external-store@1.2.0 与
          # schema-form 的 @deepseek-ai/schemastery@3.18.1——v0.5.2 只下 6 个，
          # compat 构建抛「闭包包缺失」被非阻断 WARN 吞掉 → 官方包缺
          # client-compat.js（插件端 missed the module table）。闭包全集 10 包
          # （+ schemastery 的 @standard-schema/spec@1.1.0 / @deepseek-ai/cosmokit@1.8.2）。
          for spec in "@deepseek-ai/dsh-client-web-react@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-schema-form@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-primitives@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-slots@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-attachment@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-renderer@0.1.0-rc.7" \
                      "use-sync-external-store@1.2.0" \
                      "@deepseek-ai/schemastery@3.18.1" \
                      "@standard-schema/spec@1.1.0" \
                      "@deepseek-ai/cosmokit@1.8.2"; do
            name="${spec%@*}"
            echo "Downloading $spec ..."
            tgz=$(npm pack "$spec" 2>&1 | tail -1) || { echo "WARN: $spec not found, skipping"; continue; }
            if [ ! -f "$tgz" ]; then echo "WARN: $spec tarball not found ($tgz), skipping"; continue; fi
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mkdir -p "$rc7_root/$name"
            cp -r "$tmp/package/"* "$rc7_root/$name/"
            rm -f "$tgz"
            echo "  OK: $name"
          done
          echo "rc7 packages ready (6 client pkgs + 4 closure deps)"
        shell: bash

      - name: Stage payload (CI simplified)
        run: |
          set -e
          DEST="dsh-tauri/package-payload/dsh-desktop"
          mkdir -p "$DEST"
          cp dsh-desktop/*.js "$DEST/" 2>/dev/null || true
          cp dsh-desktop/package.json "$DEST/"
          cp -r dsh-desktop/scripts "$DEST/scripts"
          cp -r dsh-desktop/assets "$DEST/assets"
          mkdir -p "$DEST/vendor"
          cp -r dsh-desktop/vendor/node "$DEST/vendor/node"
          cp -r dsh-desktop/vendor/npm "$DEST/vendor/npm" 2>/dev/null || true
          # vendored 内核 tarball（随仓库提交）：0.5.7 起 boot 链 compat-pin 步骤
          # fail-closed 校验 vendor/dsh-kernel 与 kernel-pin 一致，缺目录即拒绝启动
          # （0.5.7 本地打包踩坑复盘：五平台 stage 清单均已补齐，勿再删）。
          cp -r dsh-desktop/vendor/dsh-kernel "$DEST/vendor/dsh-kernel"
          rm -rf "$DEST/node_modules"
          cp -r dsh-desktop/node_modules "$DEST/node_modules"
          rm -rf "$DEST/node_modules/electron" "$DEST/node_modules/electron-builder" "$DEST/node_modules/electron-winstaller" "$DEST/node_modules/@electron" "$DEST/node_modules/@img/sharp-darwin-arm64" "$DEST/node_modules/@img/sharp-libvips-darwin-arm64" "$DEST/node_modules/@img/sharp-wasm32" "$DEST/node_modules/@koromix/koffi-darwin-arm64"
          # Codex/Claude 原生二进制（optional platform packages，~700MB 死重）：内核子代理
          # 适配器仅在真正拉起 Codex/Claude Code 进程时才解析这些 optional 二进制；import
          # 只读 JS 侧 metapackage。glob 精准命中各平台 variant（codex-win32-x64 /
          # codex-linux-x64 / claude-agent-sdk-darwin-arm64 ...），保留 metapackage 不断 import 图。
          rm -rf "$DEST"/node_modules/@openai/codex-* "$DEST"/node_modules/@anthropic-ai/claude-agent-sdk-*
          # rc7 vendor（非阻断——renderer 三级回落链兜底）
          if [ -d "dsh-desktop/dist/win-unpacked/resources/app/node_modules/@deepseek-ai" ]; then
            for pkg in dsh-desktop/dist/win-unpacked/resources/app/node_modules/@deepseek-ai/*/; do
              name=$(basename "$pkg")
              [ -d "$DEST/node_modules/@deepseek-ai/$name" ] || cp -r "$pkg" "$DEST/node_modules/@deepseek-ai/$name"
            done
          fi
          # compat（构建报错可不阻断——但产物必须在位，见下方 PD1 门禁）
          node dsh-tauri/scripts/build-client-compat.mjs 2>&1 || echo "WARN: compat failed (non-blocking)"
          # PD1 复盘门禁：v0.5.2 的 compat 闭包缺包被上一行 WARN 静默吞掉，官方
          # 包缺 client-compat.js（插件端 missed the module table 常态化）。
          # 构建器允许降级告警，装出去的包不允许缺件——缺即拒绝发布。
          COMPAT="$DEST/node_modules/@deepseek-ai/dsh-web-frontend/dist/assets/client-compat.js"
          if [ ! -f "$COMPAT" ]; then
            echo "::error::client-compat.js 缺失（build-client-compat 闭包失败——rc7 下载缺包？）"
            exit 1
          fi
          echo "OK: client-compat.js in payload ($(stat -c%s "$COMPAT") bytes)"
          echo "Payload: $(du -sm "$DEST" | cut -f1)MB"
        shell: bash

      - name: Run tests (unit only, skip env-dependent integration)
        run: |
          cd dsh-tauri/src-tauri
          # GHA 的 shell: bash 自带 -e（errexit）——失败管道会立刻终止本步骤，
          # 下面的注解透出逻辑永远不执行（前两轮注解为空的根因）。显式关掉。
          set +e
          cargo test --workspace --quiet -- --skip sidecar_boot_sandbox --skip full_boot_to_kernel --skip broken_companion --skip corrupted_patch 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          # CI 日志下载域名（results-receiver.actions.githubusercontent.com）直连
          # 被墙——失败用例名以 ::error:: 注解透出（注解走 api.github.com 加速
          # 通道，是墙内环境唯一可读的诊断出口）
          grep -E "FAILED|panicked at|^error" test-output.txt | head -15 | sed 's/^/::error::/' || true
          tail -22 test-output.txt | sed 's/^/::error::TAIL /' || true
          exit $code
        shell: bash

      - name: Assert bundled D3DCOMPILER_47.dll (B1 fix prerequisite)
        # B1 修复：WebView2 在缺少系统 D3DCompiler_47.dll 的机器（LTSC/精简版/
        # Server 无桌面体验）上加载失败 → 应用进程入口报「丢失 D3DCOMPILER_47.dll」。
        # 修复=随包旁路分发（tauri.conf.json resources → 安装到 exe 同目录，Windows
        # 加载器优先应用目录）。此处构建前断言源 DLL 在位且完整，防静默缺失。
        shell: bash
        run: |
          set -euo pipefail
          f="dsh-tauri/dlls/D3DCOMPILER_47.dll"
          [ -f "$f" ] || { echo "::error::缺少 $f（B1 修复依赖）"; exit 1; }
          size=$(stat -c%s "$f")
          if [ "$size" -lt 4000000 ]; then
            echo "::error::$f 体积异常（${size} 字节，预期 ~4.6MB）"
            exit 1
          fi
          node dsh-tauri/scripts/check-imports.mjs --pe "$f" --expect-machine x64
          echo "OK: $f ($size bytes)"

      - name: Build installer
        run: |
          cd dsh-tauri
          echo "=== Verifying prerequisites ==="
          ls -la src-tauri/src/app/tauri.conf.json
          ls -la src-tauri/src/app/icons/icon.ico
          ls -la src-tauri/src/app/nsis/installerHooks.nsh
          ls -la ui/index.html
          ls package-payload/dsh-desktop/package.json
          echo "=== Building ==="
          # 不加 --verbose：rustc 全量 verbose 日志极大，失败时下方兜底分支会
          # 单独重跑 cargo build 取尾部错误，诊断信息不丢。
          npx --yes @tauri-apps/cli@latest build --config src-tauri/src/app/tauri.conf.json --target x86_64-pc-windows-msvc 2>&1 || {
            echo "=== BUILD FAILED ==="
            echo "=== Checking cargo build separately ==="
            cd src-tauri && cargo build --release --target x86_64-pc-windows-msvc -p dsh-tauri-app 2>&1 | tail -30
            echo "=== Exe exists: $(ls target/x86_64-pc-windows-msvc/release/dsh-tauri-app.exe 2>/dev/null) ==="
            exit 1
          }
        shell: bash

      - name: Rename installer (assert version + size)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          cd dsh-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          ls -la
          # 版本混装防线②：Rust cache 恢复的 bundle 目录可能残留上个版本的改名
          # 产物——上传 glob 是 DSH-Desktop-Setup-*，非本版本的旧文件必须清掉
          #（0.5.6/0.5.7 混装被 verify 拒发的实爆）。
          find . -maxdepth 1 -name 'DSH-Desktop-Setup-*' ! -name "DSH-Desktop-Setup-${VERSION}-win-x64.exe" -delete
          # 版本混装防线③：Tauri NSIS 产物名内嵌 tauri.conf.json 的版本
          # （<productName>_<ver>_x64-setup.exe）——期望版本不符时 glob 落空即失败
          shopt -s nullglob
          src=( *_"${VERSION}"_x64-setup.exe )
          if [ ${#src[@]} -eq 0 ]; then
            echo "::error::未找到 *_${VERSION}_x64-setup.exe——NSIS 内嵌版本与期望不符（见上方目录清单）"
            exit 1
          fi
          cp "${src[0]}" "DSH-Desktop-Setup-${VERSION}-win-x64.exe"
          size=$(stat -c%s "DSH-Desktop-Setup-${VERSION}-win-x64.exe")
          if [ "$size" -lt 52428800 ]; then
            echo "::error::安装包体积异常（${size} 字节 < 50MB）——疑似 payload 缺失（v0.5.0 参考：~72MB）"
            exit 1
          fi
          echo "OK: DSH-Desktop-Setup-${VERSION}-win-x64.exe ($size bytes)"
          ls -la

      - name: Assert D3DCOMPILER_47.dll inside NSIS installer (B1 fix gate)
        # B1 修复门禁（追加）：解包安装包断言 D3DCOMPILER_47.dll 已随包打进去，
        # 位于 exe 旁（$INSTDIR 根）——防 resources 配置回退导致用户精简系统再次
        # 撞上「丢失 D3DCOMPILER_47.dll」。NSIS 安装包可用 7z 直接列内容。
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          f="dsh-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/DSH-Desktop-Setup-${VERSION}-win-x64.exe"
          [ -f "$f" ] || { echo "::error::未找到 $f"; exit 1; }
          7z l "$f" | grep -i "D3DCOMPILER_47.dll" || {
            echo "::error::NSIS 安装包内缺少 D3DCOMPILER_47.dll——B1 修复未生效（检查 tauri.conf.json resources）"
            exit 1
          }
          echo "OK: D3DCOMPILER_47.dll 已随安装包分发"

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-setup
          path: dsh-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/DSH-Desktop-Setup-*-win-x64.exe
          if-no-files-found: error

      - name: Upload raw exe artifact (for portable job)
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-bin
          path: dsh-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/dsh-tauri-app.exe
          if-no-files-found: error

  # Windows ARM64：交叉编译 aarch64-pc-windows-msvc。
  # Node v24.15.0 起官方提供 win-arm64 二进制（win-arm64/node.exe，已验证 200 OK）。
  # 实验性：payload 中 sharp 等原生模块仍为 x64 prebuild，ARM64 设备上靠
  # Windows 11 x64 模拟（Prism）或自愈链兜底，故 continue-on-error。
  build-windows-arm64:
    name: Windows ARM64 (NSIS, experimental)
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: Resolve version and ref
        # 同 build-windows：dispatch 强制 checkout tag（版本混装防线①）
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            tag='${{ github.ref_name }}'
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}

      - name: Assert tauri.conf.json version == tag version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.ver.outputs.version }}'
          ACTUAL=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dsh-tauri/src-tauri/src/app/tauri.conf.json | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::无法从 dsh-tauri/src-tauri/src/app/tauri.conf.json 解析 version 字段"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::版本混装防线：期望 ${EXPECTED}，但检出的 tauri.conf.json version=${ACTUAL}"
            exit 1
          fi
          echo "OK: tauri.conf.json version=${ACTUAL} == 期望 ${EXPECTED}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-tauri/src-tauri/target
          key: rust-win-arm64-${{ hashFiles('dsh-tauri/src-tauri/Cargo.lock') }}
          restore-keys: rust-win-arm64-

      - name: Install dsh-desktop dependencies
        run: cd dsh-desktop && npm ci --ignore-scripts
        shell: pwsh

      - name: Download vendor node (win-arm64)
        run: |
          mkdir -Force dsh-desktop\vendor\node | Out-Null
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.15.0/win-arm64/node.exe' -OutFile dsh-desktop\vendor\node\node.exe
        shell: pwsh

      - name: Download vendor npm
        run: |
          $tmp = "$env:TEMP\npm-pkg"
          mkdir -Force $tmp | Out-Null
          Invoke-WebRequest -Uri 'https://registry.npmmirror.com/npm/-/npm-10.9.2.tgz' -OutFile "$tmp\npm.tgz"
          tar -xzf "$tmp\npm.tgz" -C $tmp
          mkdir -Force dsh-desktop\vendor\npm | Out-Null
          Copy-Item "$tmp\package\*" dsh-desktop\vendor\npm\ -Recurse -Force
        shell: pwsh

      - name: Download rc7 client packages (for compat)
        run: |
          set -e
          cd dsh-desktop
          rc7_root="dist/win-unpacked/resources/app/node_modules"
          mkdir -p "$rc7_root"
          # PD1 对账（v0.5.2 复盘）：6 个 rc.7 客户端包之外，build-client-compat.mjs
          # 的闭包 BFS 还需要 web-react 的 use-sync-external-store@1.2.0 与
          # schema-form 的 @deepseek-ai/schemastery@3.18.1——v0.5.2 只下 6 个，
          # compat 构建抛「闭包包缺失」被非阻断 WARN 吞掉 → 官方包缺
          # client-compat.js（插件端 missed the module table）。闭包全集 10 包
          # （+ schemastery 的 @standard-schema/spec@1.1.0 / @deepseek-ai/cosmokit@1.8.2）。
          for spec in "@deepseek-ai/dsh-client-web-react@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-schema-form@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-primitives@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-slots@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-attachment@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-renderer@0.1.0-rc.7" \
                      "use-sync-external-store@1.2.0" \
                      "@deepseek-ai/schemastery@3.18.1" \
                      "@standard-schema/spec@1.1.0" \
                      "@deepseek-ai/cosmokit@1.8.2"; do
            name="${spec%@*}"
            echo "Downloading $spec ..."
            tgz=$(npm pack "$spec" 2>&1 | tail -1) || { echo "WARN: $spec not found, skipping"; continue; }
            if [ ! -f "$tgz" ]; then echo "WARN: $spec tarball not found ($tgz), skipping"; continue; fi
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mkdir -p "$rc7_root/$name"
            cp -r "$tmp/package/"* "$rc7_root/$name/"
            rm -f "$tgz"
            echo "  OK: $name"
          done
          echo "rc7 packages ready (6 client pkgs + 4 closure deps)"
        shell: bash

      - name: Stage payload (CI simplified)
        run: |
          set -e
          DEST="dsh-tauri/package-payload/dsh-desktop"
          mkdir -p "$DEST"
          cp dsh-desktop/*.js "$DEST/" 2>/dev/null || true
          cp dsh-desktop/package.json "$DEST/"
          cp -r dsh-desktop/scripts "$DEST/scripts"
          cp -r dsh-desktop/assets "$DEST/assets"
          mkdir -p "$DEST/vendor"
          cp -r dsh-desktop/vendor/node "$DEST/vendor/node"
          cp -r dsh-desktop/vendor/npm "$DEST/vendor/npm" 2>/dev/null || true
          # vendored 内核 tarball（随仓库提交）：0.5.7 起 boot 链 compat-pin 步骤
          # fail-closed 校验 vendor/dsh-kernel 与 kernel-pin 一致，缺目录即拒绝启动
          # （0.5.7 本地打包踩坑复盘：五平台 stage 清单均已补齐，勿再删）。
          cp -r dsh-desktop/vendor/dsh-kernel "$DEST/vendor/dsh-kernel"
          rm -rf "$DEST/node_modules"
          cp -r dsh-desktop/node_modules "$DEST/node_modules"
          rm -rf "$DEST/node_modules/electron" "$DEST/node_modules/electron-builder" "$DEST/node_modules/electron-winstaller" "$DEST/node_modules/@electron" "$DEST/node_modules/@img/sharp-darwin-arm64" "$DEST/node_modules/@img/sharp-libvips-darwin-arm64" "$DEST/node_modules/@img/sharp-wasm32" "$DEST/node_modules/@koromix/koffi-darwin-arm64"
          # Codex/Claude 原生二进制（optional platform packages，~700MB 死重）：内核子代理
          # 适配器仅在真正拉起 Codex/Claude Code 进程时才解析这些 optional 二进制；import
          # 只读 JS 侧 metapackage。glob 精准命中各平台 variant（codex-win32-x64 /
          # codex-linux-x64 / claude-agent-sdk-darwin-arm64 ...），保留 metapackage 不断 import 图。
          rm -rf "$DEST"/node_modules/@openai/codex-* "$DEST"/node_modules/@anthropic-ai/claude-agent-sdk-*
          # rc7 vendor（非阻断——renderer 三级回落链兜底）
          if [ -d "dsh-desktop/dist/win-unpacked/resources/app/node_modules/@deepseek-ai" ]; then
            for pkg in dsh-desktop/dist/win-unpacked/resources/app/node_modules/@deepseek-ai/*/; do
              name=$(basename "$pkg")
              [ -d "$DEST/node_modules/@deepseek-ai/$name" ] || cp -r "$pkg" "$DEST/node_modules/@deepseek-ai/$name"
            done
          fi
          # compat（构建报错可不阻断——但产物必须在位，见下方 PD1 门禁）
          node dsh-tauri/scripts/build-client-compat.mjs 2>&1 || echo "WARN: compat failed (non-blocking)"
          # PD1 复盘门禁：v0.5.2 的 compat 闭包缺包被上一行 WARN 静默吞掉，官方
          # 包缺 client-compat.js（插件端 missed the module table 常态化）。
          # 构建器允许降级告警，装出去的包不允许缺件——缺即拒绝发布。
          COMPAT="$DEST/node_modules/@deepseek-ai/dsh-web-frontend/dist/assets/client-compat.js"
          if [ ! -f "$COMPAT" ]; then
            echo "::error::client-compat.js 缺失（build-client-compat 闭包失败——rc7 下载缺包？）"
            exit 1
          fi
          echo "OK: client-compat.js in payload ($(stat -c%s "$COMPAT") bytes)"
          echo "Payload: $(du -sm "$DEST" | cut -f1)MB"
        shell: bash

      - name: Build installer (aarch64 cross)
        run: |
          cd dsh-tauri
          npx --yes @tauri-apps/cli@latest build --config src-tauri/src/app/tauri.conf.json --target aarch64-pc-windows-msvc 2>&1 || {
            echo "=== ARM64 BUILD FAILED（实验性，不阻断发布） ==="
            exit 1
          }
        shell: bash

      - name: Rename installer (assert version + size)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          NSIS_DIR="dsh-tauri/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis"
          if [ ! -d "$NSIS_DIR" ]; then echo "no nsis bundle dir (build failed?), skip rename"; exit 0; fi
          cd "$NSIS_DIR"
          ls -la
          # 版本混装防线②：cache 恢复的 bundle 目录可能残留上个版本的改名产物
          #（上传 glob 是 DSH-Desktop-Setup-*，非本版本旧文件必须清掉）。
          find . -maxdepth 1 -name 'DSH-Desktop-Setup-*' ! -name "DSH-Desktop-Setup-${VERSION}-win-arm64.exe" -delete
          shopt -s nullglob
          src=( *_"${VERSION}"_arm64-setup.exe )
          if [ ${#src[@]} -eq 0 ]; then
            echo "::error::未找到 *_${VERSION}_arm64-setup.exe——NSIS 内嵌版本与期望不符（实验线也不允许版本混装；见上方目录清单）"
            exit 1
          fi
          cp "${src[0]}" "DSH-Desktop-Setup-${VERSION}-win-arm64.exe"
          size=$(stat -c%s "DSH-Desktop-Setup-${VERSION}-win-arm64.exe")
          if [ "$size" -lt 52428800 ]; then
            echo "::error::安装包体积异常（${size} 字节 < 50MB；v0.5.0 参考：~68MB）"
            exit 1
          fi
          echo "OK: DSH-Desktop-Setup-${VERSION}-win-arm64.exe ($size bytes)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-arm64-setup
          path: dsh-tauri/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/DSH-Desktop-Setup-*-win-arm64.exe
          if-no-files-found: ignore

  # Windows x64 便携版 zip：解压到任意目录即用，数据存 exe 旁 data/。
  # exe 来自 build-windows 产物（win-x64-bin），resources 与安装包同源重新组装。
  build-portable:
    name: Windows x64 Portable (zip)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [build-windows]
    if: needs.build-windows.result == 'success'
    steps:
      - name: Resolve version and ref
        # 同 build-windows：dispatch 强制 checkout tag——便携版 resources（scripts/
        # sidecar/ui/payload 组装脚本）必须与安装包同源同版本。
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            tag='${{ github.ref_name }}'
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}

      - name: Assert tauri.conf.json version == tag version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.ver.outputs.version }}'
          ACTUAL=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dsh-tauri/src-tauri/src/app/tauri.conf.json | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::无法从 dsh-tauri/src-tauri/src/app/tauri.conf.json 解析 version 字段"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::版本混装防线：期望 ${EXPECTED}，但检出的 tauri.conf.json version=${ACTUAL}"
            exit 1
          fi
          echo "OK: tauri.conf.json version=${ACTUAL} == 期望 ${EXPECTED}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: win-x64-bin
          path: exe-artifact

      # ---- 以下与 build-windows 的 payload 组装完全同源（便携版 resources
      #      必须与安装包逐字节同源，否则装出来的包与 zip 行为分叉）----
      - name: Install dsh-desktop dependencies
        run: cd dsh-desktop && npm ci --ignore-scripts
        shell: pwsh

      - name: Download vendor node
        run: |
          mkdir -Force dsh-desktop\vendor\node | Out-Null
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.15.0/win-x64/node.exe' -OutFile dsh-desktop\vendor\node\node.exe
        shell: pwsh

      - name: Download vendor npm
        run: |
          $tmp = "$env:TEMP\npm-pkg"
          mkdir -Force $tmp | Out-Null
          Invoke-WebRequest -Uri 'https://registry.npmmirror.com/npm/-/npm-10.9.2.tgz' -OutFile "$tmp\npm.tgz"
          tar -xzf "$tmp\npm.tgz" -C $tmp
          mkdir -Force dsh-desktop\vendor\npm | Out-Null
          Copy-Item "$tmp\package\*" dsh-desktop\vendor\npm\ -Recurse -Force
        shell: pwsh

      - name: Download rc7 client packages (for compat)
        run: |
          set -e
          cd dsh-desktop
          rc7_root="dist/win-unpacked/resources/app/node_modules"
          mkdir -p "$rc7_root"
          # PD1 对账（v0.5.2 复盘）：6 个 rc.7 客户端包之外，build-client-compat.mjs
          # 的闭包 BFS 还需要 web-react 的 use-sync-external-store@1.2.0 与
          # schema-form 的 @deepseek-ai/schemastery@3.18.1——v0.5.2 只下 6 个，
          # compat 构建抛「闭包包缺失」被非阻断 WARN 吞掉 → 官方包缺
          # client-compat.js（插件端 missed the module table）。闭包全集 10 包
          # （+ schemastery 的 @standard-schema/spec@1.1.0 / @deepseek-ai/cosmokit@1.8.2）。
          for spec in "@deepseek-ai/dsh-client-web-react@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-schema-form@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-primitives@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-slots@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-attachment@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-renderer@0.1.0-rc.7" \
                      "use-sync-external-store@1.2.0" \
                      "@deepseek-ai/schemastery@3.18.1" \
                      "@standard-schema/spec@1.1.0" \
                      "@deepseek-ai/cosmokit@1.8.2"; do
            name="${spec%@*}"
            echo "Downloading $spec ..."
            tgz=$(npm pack "$spec" 2>&1 | tail -1) || { echo "WARN: $spec not found, skipping"; continue; }
            if [ ! -f "$tgz" ]; then echo "WARN: $spec tarball not found ($tgz), skipping"; continue; fi
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mkdir -p "$rc7_root/$name"
            cp -r "$tmp/package/"* "$rc7_root/$name/"
            rm -f "$tgz"
            echo "  OK: $name"
          done
          echo "rc7 packages ready (6 client pkgs + 4 closure deps)"
        shell: bash

      - name: Stage payload (CI simplified)
        run: |
          set -e
          DEST="dsh-tauri/package-payload/dsh-desktop"
          mkdir -p "$DEST"
          cp dsh-desktop/*.js "$DEST/" 2>/dev/null || true
          cp dsh-desktop/package.json "$DEST/"
          cp -r dsh-desktop/scripts "$DEST/scripts"
          cp -r dsh-desktop/assets "$DEST/assets"
          mkdir -p "$DEST/vendor"
          cp -r dsh-desktop/vendor/node "$DEST/vendor/node"
          cp -r dsh-desktop/vendor/npm "$DEST/vendor/npm" 2>/dev/null || true
          # vendored 内核 tarball（随仓库提交）：0.5.7 起 boot 链 compat-pin 步骤
          # fail-closed 校验 vendor/dsh-kernel 与 kernel-pin 一致，缺目录即拒绝启动
          # （0.5.7 本地打包踩坑复盘：五平台 stage 清单均已补齐，勿再删）。
          cp -r dsh-desktop/vendor/dsh-kernel "$DEST/vendor/dsh-kernel"
          rm -rf "$DEST/node_modules"
          cp -r dsh-desktop/node_modules "$DEST/node_modules"
          rm -rf "$DEST/node_modules/electron" "$DEST/node_modules/electron-builder" "$DEST/node_modules/electron-winstaller" "$DEST/node_modules/@electron" "$DEST/node_modules/@img/sharp-darwin-arm64" "$DEST/node_modules/@img/sharp-libvips-darwin-arm64" "$DEST/node_modules/@img/sharp-wasm32" "$DEST/node_modules/@koromix/koffi-darwin-arm64"
          # Codex/Claude 原生二进制（optional platform packages，~700MB 死重）：内核子代理
          # 适配器仅在真正拉起 Codex/Claude Code 进程时才解析这些 optional 二进制；import
          # 只读 JS 侧 metapackage。glob 精准命中各平台 variant（codex-win32-x64 /
          # codex-linux-x64 / claude-agent-sdk-darwin-arm64 ...），保留 metapackage 不断 import 图。
          rm -rf "$DEST"/node_modules/@openai/codex-* "$DEST"/node_modules/@anthropic-ai/claude-agent-sdk-*
          # rc7 vendor（非阻断——renderer 三级回落链兜底）
          if [ -d "dsh-desktop/dist/win-unpacked/resources/app/node_modules/@deepseek-ai" ]; then
            for pkg in dsh-desktop/dist/win-unpacked/resources/app/node_modules/@deepseek-ai/*/; do
              name=$(basename "$pkg")
              [ -d "$DEST/node_modules/@deepseek-ai/$name" ] || cp -r "$pkg" "$DEST/node_modules/@deepseek-ai/$name"
            done
          fi
          # compat（构建报错可不阻断——但产物必须在位，见下方 PD1 门禁）
          node dsh-tauri/scripts/build-client-compat.mjs 2>&1 || echo "WARN: compat failed (non-blocking)"
          # PD1 复盘门禁：v0.5.2 的 compat 闭包缺包被上一行 WARN 静默吞掉，官方
          # 包缺 client-compat.js（插件端 missed the module table 常态化）。
          # 构建器允许降级告警，装出去的包不允许缺件——缺即拒绝发布。
          COMPAT="$DEST/node_modules/@deepseek-ai/dsh-web-frontend/dist/assets/client-compat.js"
          if [ ! -f "$COMPAT" ]; then
            echo "::error::client-compat.js 缺失（build-client-compat 闭包失败——rc7 下载缺包？）"
            exit 1
          fi
          echo "OK: client-compat.js in payload ($(stat -c%s "$COMPAT") bytes)"
          echo "Payload: $(du -sm "$DEST" | cut -f1)MB"
        shell: bash

      # ---- 组装便携版布局（与 NSIS 安装后布局一致）----
      #   DSH Desktop/DSH Desktop.exe        ← win-x64-bin 产物
      #   DSH Desktop/portable.marker        ← 便携模式标记（userData → exe 旁 data/）
      #   DSH Desktop/resources/dsh-desktop|sidecar|ui/
      - name: Assemble portable layout
        shell: bash
        run: |
          ROOT="portable/DSH Desktop"
          mkdir -p "$ROOT/resources"
          cp exe-artifact/dsh-tauri-app.exe "$ROOT/DSH Desktop.exe"
          printf 'DSH Desktop portable marker\n%s\n' "存在此文件时 DSH Desktop 以便携模式运行：用户数据保存在本目录 data/ 下。删除此文件则恢复常规安装版数据路径。" > "$ROOT/portable.marker"
          # robocopy 成功码 0-7，≥8 才失败（Git Bash 下 flag 用 // 形式）
          rc=0; robocopy "dsh-tauri/package-payload/dsh-desktop" "$ROOT/resources/dsh-desktop" //MIR //R:2 //W:1 > /dev/null || rc=$?
          [ "$rc" -lt 8 ] || { echo "robocopy dsh-desktop failed: $rc"; exit 1; }
          # Windows 包不带 unix node 二进制（stage-payload 口径；防本机历史残留混入）
          rm -f "$ROOT/resources/dsh-desktop/vendor/node/node"
          # N1 门禁（v0.5.4 便携版修复）：win node.exe 应在位——三级解析链
          # （系统 ≥22 → 内置 vendor → 清晰报错）的保底层。缺件会让无本地
          # node 的便携版用户只剩报错路径（历史版本实测「打不开」主因之一）。
          # 降级为告警（非 exit 1）：下载/staging 步骤已成功、node.exe 通常
          # 在位，robocopy 后路径偶有平台差异致误判——三级链系统 node 兜底，
          # 不阻断发布。
          if [ -f "$ROOT/resources/dsh-desktop/vendor/node/node.exe" ]; then
            echo "OK: 内置 node.exe 在位 ($(stat -c%s "$ROOT/resources/dsh-desktop/vendor/node/node.exe") bytes)"
          else
            echo "::warning::便携版缺内置 node.exe（vendor/node/node.exe）——三级解析链将回落系统 node；无本地 node 的便携版用户会走到清晰报错路径"
            ls -la "$ROOT/resources/dsh-desktop/vendor/node" 2>&1 | head -5 || true
          fi
          rc=0; robocopy "dsh-tauri/sidecar" "$ROOT/resources/sidecar" //MIR //R:2 //W:1 > /dev/null || rc=$?
          [ "$rc" -lt 8 ] || { echo "robocopy sidecar failed: $rc"; exit 1; }
          rc=0; robocopy "dsh-tauri/ui" "$ROOT/resources/ui" //MIR //R:2 //W:1 > /dev/null || rc=$?
          [ "$rc" -lt 8 ] || { echo "robocopy ui failed: $rc"; exit 1; }
          echo "=== 便携版布局 ==="
          ls -la "$ROOT"
          du -sm "$ROOT" "$ROOT/resources/dsh-desktop"

      - name: Bundle D3DCOMPILER_47.dll beside portable exe (B1 fix)
        # B1 修复：便携版布局手工组装，不经 NSIS/tauri resources，需显式把 DLL
        # 放到 exe 同目录（与安装版 $INSTDIR 根旁路口径一致），否则精简系统用户
        # 解压即撞「丢失 D3DCOMPILER_47.dll」。
        shell: bash
        run: |
          set -euo pipefail
          ROOT="portable/DSH Desktop"
          [ -f "dsh-tauri/dlls/D3DCOMPILER_47.dll" ] || { echo "::error::缺少 dsh-tauri/dlls/D3DCOMPILER_47.dll"; exit 1; }
          cp "dsh-tauri/dlls/D3DCOMPILER_47.dll" "$ROOT/D3DCOMPILER_47.dll"
          [ -f "$ROOT/D3DCOMPILER_47.dll" ] && [ -f "$ROOT/DSH Desktop.exe" ] || { echo "::error::便携版 B1 布局异常"; exit 1; }
          echo "OK: $ROOT/D3DCOMPILER_47.dll ($(stat -c%s "$ROOT/D3DCOMPILER_47.dll") bytes)"

      - name: Create portable zip
        shell: pwsh
        run: |
          $VERSION = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "portable/DSH Desktop" -DestinationPath "DSH-Desktop-Portable-$VERSION-win-x64.zip" -Force
          $mb = [math]::Round((Get-Item "DSH-Desktop-Portable-$VERSION-win-x64.zip").Length / 1MB, 1)
          Write-Host "portable zip: DSH-Desktop-Portable-$VERSION-win-x64.zip ($mb MB)"

      - name: Verify portable zip (version + size)
        # 版本混装防线③：zip 内 exe 来自 build-windows（其 NSIS 名已断言版本），
        # 此处断言 zip 本身存在、文件名版本正确、体积 >50MB（v0.5.0 参考：~102MB）。
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          f="DSH-Desktop-Portable-${VERSION}-win-x64.zip"
          [ -f "$f" ] || { echo "::error::便携版 zip 缺失: $f"; exit 1; }
          size=$(stat -c%s "$f")
          if [ "$size" -lt 52428800 ]; then
            echo "::error::便携版体积异常（${size} 字节 < 50MB）——疑似 resources 组装缺失"
            exit 1
          fi
          echo "OK: $f ($size bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-portable
          path: DSH-Desktop-Portable-*-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux x64 (AppImage + deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - name: Resolve version and ref
        # 同 build-windows：dispatch 强制 checkout tag（版本混装防线①）
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            tag='${{ github.ref_name }}'
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}

      - name: Assert tauri.conf.json version == tag version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.ver.outputs.version }}'
          ACTUAL=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dsh-tauri/src-tauri/src/app/tauri.conf.json | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::无法从 dsh-tauri/src-tauri/src/app/tauri.conf.json 解析 version 字段"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::版本混装防线：期望 ${EXPECTED}，但检出的 tauri.conf.json version=${ACTUAL}"
            exit 1
          fi
          echo "OK: tauri.conf.json version=${ACTUAL} == 期望 ${EXPECTED}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          # libfuse2：linuxdeploy(AppImage) 运行依赖——ubuntu-22.04 默认不带，
          # 缺它 AppImage 打包报 failed to run linuxdeploy
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-tauri/src-tauri/target
          key: rust-linux-${{ hashFiles('dsh-tauri/src-tauri/Cargo.lock') }}

      - name: Install dsh-desktop dependencies
        run: cd dsh-desktop && npm ci --ignore-scripts

      - name: Download vendor node
        run: |
          mkdir -p dsh-desktop/vendor/node
          wget -q https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.gz
          tar -xzf node-v24.15.0-linux-x64.tar.gz
          cp node-v24.15.0-linux-x64/bin/node dsh-desktop/vendor/node/node
          chmod +x dsh-desktop/vendor/node/node

      - name: Download rc7 client packages
        run: |
          cd dsh-desktop
          dest="dist/win-unpacked/resources/app/node_modules/@deepseek-ai"
          mkdir -p "$dest"
          for pkg in dsh-client-web-react dsh-client-schema-form dsh-client-ui-primitives dsh-client-ui-slots dsh-client-ui-attachment dsh-client-ui-renderer; do
            full="@deepseek-ai/$pkg"
            echo "Downloading $full@0.1.0-rc.7 ..."
            tgz=$(npm pack "$full@0.1.0-rc.7" 2>&1 | tail -1)
            if [ ! -f "$tgz" ]; then echo "WARN: $full not found, skipping"; continue; fi
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mkdir -p "$dest/$pkg"
            cp -r "$tmp/package/"* "$dest/$pkg/"
            rm -f "$tgz"
          done
          echo "rc7 packages ready"

      - name: Stage payload (CI simplified)
        run: |
          set -e
          DEST="dsh-tauri/package-payload/dsh-desktop"
          mkdir -p "$DEST"
          cp dsh-desktop/*.js "$DEST/" 2>/dev/null || true
          cp dsh-desktop/package.json "$DEST/"
          cp -r dsh-desktop/scripts "$DEST/scripts"
          cp -r dsh-desktop/assets "$DEST/assets"
          mkdir -p "$DEST/vendor"
          cp -r dsh-desktop/vendor/node "$DEST/vendor/node"
          cp -r dsh-desktop/vendor/npm "$DEST/vendor/npm" 2>/dev/null || true
          # vendored 内核 tarball（随仓库提交）：0.5.7 起 boot 链 compat-pin 步骤
          # fail-closed 校验 vendor/dsh-kernel 与 kernel-pin 一致，缺目录即拒绝启动
          # （0.5.7 本地打包踩坑复盘：五平台 stage 清单均已补齐，勿再删）。
          cp -r dsh-desktop/vendor/dsh-kernel "$DEST/vendor/dsh-kernel"
          rm -rf "$DEST/node_modules"
          cp -r dsh-desktop/node_modules "$DEST/node_modules"
          rm -rf "$DEST/node_modules/electron" "$DEST/node_modules/electron-builder" "$DEST/node_modules/electron-winstaller" "$DEST/node_modules/@electron"
          # Codex/Claude 原生二进制（optional platform packages，~700MB 死重）：内核子代理
          # 适配器仅在真正拉起 Codex/Claude Code 进程时才解析这些 optional 二进制；import
          # 只读 JS 侧 metapackage。glob 精准命中各平台 variant（codex-win32-x64 /
          # codex-linux-x64 / claude-agent-sdk-darwin-arm64 ...），保留 metapackage 不断 import 图。
          rm -rf "$DEST"/node_modules/@openai/codex-* "$DEST"/node_modules/@anthropic-ai/claude-agent-sdk-*
          # musl 产物全剔除：linuxdeploy 扫描 AppDir 内全部 ELF，遇 musl 链接
          # 的原生模块（@photostructure/sqlite 的 *.musl.node、@koromix/koffi
          # 的 musl_x64/ 目录等）会找 libc.musl-x86_64.so.1（glibc runner 上
          # 不存在）→ AppImage 打包失败。glibc 系统上 musl 产物全是死重量。
          find "$DEST/node_modules" "$DEST/assets" -iname "*musl*" -not -name "*.py" -exec rm -rf {} + 2>/dev/null || true
          echo "Payload: $(du -sm "$DEST" | cut -f1)MB"

      - name: Build installer
        # --bundles 覆盖 tauri.conf.json 的 targets:["nsis"]（Windows 专用，
        # 在 Linux/macOS 上不会产出任何 bundle——历史 run 因此从未真正打过
        # Linux/macOS 安装包，旧 upload 用 warn 级别静默吞掉了）。
        # 第二个 --config 内联覆盖 productName 去空格："DSH Desktop"（含空格）
        # 是 linuxdeploy/AppImage 打包失败的已知根因（deb 不受影响）；产物
        # 最终文件名由 Rename 步骤统一，与 productName 无耦合。
        # deb 先行（必须成功）；AppImage 单独跑且非阻断——有 deb 兜底。
        # APPIMAGE_EXTRACT_AND_RUN=1：linuxdeploy 自身是 AppImage，runner 无
        # /dev/fuse 无法自挂载执行（exec 失败＝"failed to run linuxdeploy"），
        # 强制解压运行；NO_STRIP=1 防符号剥离报错。
        run: |
          cd dsh-tauri
          npx --yes @tauri-apps/cli@latest build --config src-tauri/src/app/tauri.conf.json --config '{"productName":"DSH-Desktop"}' --target x86_64-unknown-linux-gnu --bundles deb
          export APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1
          npx --yes @tauri-apps/cli@latest build --config src-tauri/src/app/tauri.conf.json --config '{"productName":"DSH-Desktop"}' --target x86_64-unknown-linux-gnu --bundles appimage || echo "::warning::AppImage bundling failed (deb still published)"

      - name: Rename artifacts (assert version + size)
        run: |
          set -euo pipefail
          VERSION=${{ steps.ver.outputs.version }}
          BUNDLE=dsh-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          ls -la "$BUNDLE/appimage" "$BUNDLE/deb" || true
          shopt -s nullglob
          # deb（底线产物）：产物名内嵌 tauri.conf.json 版本（<name>_<ver>_amd64.deb）
          debs=( "$BUNDLE"/deb/*_"${VERSION}"_amd64.deb )
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::未找到 *_${VERSION}_amd64.deb——deb 内嵌版本与期望不符（见上方目录清单）"
            exit 1
          fi
          cp "${debs[0]}" "dsh-desktop_${VERSION}_amd64.deb"
          size=$(stat -c%s "dsh-desktop_${VERSION}_amd64.deb")
          if [ "$size" -lt 52428800 ]; then
            echo "::error::deb 体积异常（${size} 字节 < 50MB；v0.5.0 参考：~122MB）"
            exit 1
          fi
          echo "OK: dsh-desktop_${VERSION}_amd64.deb ($size bytes)"
          # AppImage（可选——linuxdeploy 偶发失败有 deb 兜底）：产出时同样断言版本
          appimages=( "$BUNDLE"/appimage/*_"${VERSION}"_*.AppImage )
          if [ ${#appimages[@]} -gt 0 ]; then
            cp "${appimages[0]}" "DSH-Desktop-${VERSION}-linux-x64.AppImage"
            asize=$(stat -c%s "DSH-Desktop-${VERSION}-linux-x64.AppImage")
            if [ "$asize" -lt 52428800 ]; then
              echo "::error::AppImage 体积异常（${asize} 字节 < 50MB；v0.5.0 参考：~190MB）"
              exit 1
            fi
            echo "OK: DSH-Desktop-${VERSION}-linux-x64.AppImage ($asize bytes)"
          else
            echo "::warning::AppImage 未产出（仅 deb 发布）"
          fi
          ls -la dsh-desktop_*_amd64.deb DSH-Desktop-*-linux-x64.AppImage 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            DSH-Desktop-*-linux-x64.AppImage
            dsh-desktop_*_amd64.deb
          if-no-files-found: warn

  build-macos:
    name: macOS ARM64 (dmg)
    runs-on: macos-14
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - name: Resolve version and ref
        # 同 build-windows：dispatch 强制 checkout tag（版本混装防线①）
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ github.event.inputs.version }}'
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            tag='${{ github.ref_name }}'
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.ref }}

      - name: Assert tauri.conf.json version == tag version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ steps.ver.outputs.version }}'
          ACTUAL=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dsh-tauri/src-tauri/src/app/tauri.conf.json | head -1)
          if [ -z "$ACTUAL" ]; then
