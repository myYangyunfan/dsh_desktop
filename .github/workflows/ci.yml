# PR 自动检查：语法预检 + 全量单测
# CI 红时请勿请求 review —— 先在本机复现并修复（命令见 CONTRIBUTING.md）。

name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR 上新 push 取消旧 run（省额度）；main 上的 run 不互相取消（保留完整记录）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: check-syntax + unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 探针 vendor node 下载是否落盘（临时诊断 v1.0.x 内置 node 缺口）
        # 与 tauri-release.yml 的「Download vendor node」逐步同形，用来回答一个用日志
        # 定不了的问题：release 的该步报 success，但 payload 里 vendor/node 是空目录。
        working-directory: .
        shell: pwsh
        run: |
          Write-Host "cwd=$((Get-Location).Path)"
          Write-Host "workspace=$env:GITHUB_WORKSPACE"
          if (Test-Path 'dsh-desktop\vendor\node') {
            Write-Host 'BEFORE:'
            Get-ChildItem 'dsh-desktop\vendor\node' -Force | ForEach-Object { Write-Host ("  " + $_.Name + " " + $_.Length) }
          } else { Write-Host 'BEFORE: (dir missing)' }
          mkdir -Force dsh-desktop\vendor\node | Out-Null
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.15.0/win-x64/node.exe' -OutFile dsh-desktop\vendor\node\node.exe
          Write-Host 'AFTER:'
          Get-ChildItem 'dsh-desktop\vendor\node' -Force | ForEach-Object { Write-Host ("  " + $_.Name + " " + $_.Length) }
          Write-Host ("TestPath=" + (Test-Path 'dsh-desktop\vendor\node\node.exe'))
          Write-Host ("nested(dsh-desktop\dsh-desktop=)" + (Test-Path 'dsh-desktop\dsh-desktop\vendor\node\node.exe'))
          Write-Host ("git-ignored=" + (& git check-ignore -v dsh-desktop/vendor/node/node.exe))
          Write-Host ("nested-staging=" + (Test-Path 'dsh-tauri\pp\vendor\node\node.exe'))
          exit 0
      - name: 探针② 复刻 Download vendor npm（上一步落盘的 node.exe 还在吗）
        working-directory: .
        shell: pwsh
        run: |
          $tmp = "$env:TEMP\npm-pkg"
          mkdir -Force $tmp | Out-Null
          Invoke-WebRequest -Uri 'https://registry.npmmirror.com/npm/-/npm-10.9.2.tgz' -OutFile "$tmp\npm.tgz"
          tar -xzf "$tmp\npm.tgz" -C $tmp
          mkdir -Force dsh-desktop\vendor\npm | Out-Null
          Copy-Item "$tmp\package\*" dsh-desktop\vendor\npm\ -Recurse -Force
          Write-Host ("after-npm-step node.exe=" + (Test-Path 'dsh-desktop\vendor\node\node.exe'))
          if (Test-Path 'dsh-desktop\vendor\node\node.exe') { Write-Host ("  size=" + (Get-Item 'dsh-desktop\vendor\node\node.exe').Length) }
          exit 0
      - name: 探针③ 复刻 Download rc7 client packages（npm pack 循环后 node.exe 还在吗）
        working-directory: .
        shell: bash
        run: |
          set -e
          cd dsh-desktop
          rc7_root="dist/win-unpacked/resources/app/node_modules"
          mkdir -p "$rc7_root"
          for spec in "@deepseek-ai/dsh-client-web-react@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-schema-form@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-primitives@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-slots@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-attachment@0.1.0-rc.7" \
                      "@deepseek-ai/dsh-client-ui-renderer@0.1.0-rc.7" \
                      "use-sync-external-store@1.2.0" \
                      "@deepseek-ai/schemastery@3.18.1" \
                      "@standard-schema/spec@1.1.0" \
                      "@deepseek-ai/cosmokit@1.8.2"; do
            name="${spec%@*}"
            tgz=$(npm pack "$spec" 2>&1 | tail -1) || { echo "WARN: $spec not found, skipping"; continue; }
            if [ ! -f "$tgz" ]; then echo "WARN: $spec tarball not found ($tgz), skipping"; continue; fi
            tmp=$(mktemp -d)
            tar -xzf "$tgz" -C "$tmp"
            mkdir -p "$rc7_root/$name"
            cp -r "$tmp/package/"* "$rc7_root/$name/"
            rm -f "$tgz"
            echo "  OK: $name"
          done
          cd ..
          echo "=== 逐跳检查 vendor/node ==="
          ls -la dsh-desktop/vendor/node 2>&1 || true
          if [ -f dsh-desktop/vendor/node/node.exe ]; then
            echo "after-rc7-step node.exe=yes size=$(stat -c%s dsh-desktop/vendor/node/node.exe)"
          else
            echo "::error::after-rc7-step node.exe=MISSING —— Download rc7 步抹掉了内置 node"
            exit 1
          fi
      - name: 探针④ 复刻 staging 的 cp -r，并跑新门禁
        working-directory: .
        shell: bash
        run: |
          rm -rf .tmp-probe-pp
          mkdir -p .tmp-probe-pp/vendor
          cp -r dsh-desktop/vendor/node .tmp-probe-pp/vendor/node
          ls -la .tmp-probe-pp/vendor/node
          node dsh-tauri/scripts/stage-vendor-node-gate.mjs .tmp-probe-pp node.exe
          rm -rf .tmp-probe-pp
      - name: kernel-pin 一致性校验（fail-closed，离线 tarball 与 pin 不得混版）
        run: node scripts/compat/validate-pin.js
      - name: 补丁干预面漂移校验（npm ci 后 dev 树应与快照收敛态一致）
        run: node scripts/compat/patch-surface.js verify node_modules/@deepseek-ai ..
      - name: 语法预检（构建门禁同款，prepack/predist 自动执行）
        run: node scripts/check-syntax.js
      - name: 装 pristine 内核闭包（离线 vendor tarball 解出；锚点哨兵/三态契约/基线矩阵的供料，缺失会硬红 51 例）
        run: node scripts/install-pristine-kernel.mjs
      - name: 全量单测（unit-* / desktop-*，node --test 自动发现）
        run: npm test
      - name: 余额链路验证（逻辑级 dock）
        run: node scripts/test/verify-balance-dock.cjs
