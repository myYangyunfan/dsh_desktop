# PR 自动检查：语法预检 + 全量单测
# CI 红时请勿请求 review —— 先在本机复现并修复（命令见 CONTRIBUTING.md）。

name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR 上新 push 取消旧 run（省额度）；main 上的 run 不互相取消（保留完整记录）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: check-syntax + unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: kernel-pin 一致性校验（fail-closed，离线 tarball 与 pin 不得混版）
        run: node scripts/compat/validate-pin.js
      - name: 补丁干预面漂移校验（npm ci 后 dev 树应与快照收敛态一致）
        run: node scripts/compat/patch-surface.js verify node_modules/@deepseek-ai ..
      - name: 语法预检（构建门禁同款，prepack/predist 自动执行）
        run: node scripts/check-syntax.js
      - name: 全量单测（unit-* / desktop-*，node --test 自动发现）
        run: npm test
      - name: 余额链路验证（逻辑级 dock）
        run: node scripts/test/verify-balance-dock.cjs
