[package]
name = "dsh-tauri-app"
description = "DSH Desktop Tauri 装配根：窗口壳 + 内核 supervisor + 桥 command 全量注册"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Windows 测试 exe 嵌 manifest（tauri #13419 workaround，见 build.rs）。
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
bridge = { path = "../../crates/bridge" }
kernel-process = { path = "../../crates/kernel-process" }
preview-server = { path = "../../crates/preview-server" }
shell-core = { path = "../../crates/shell-core" }
fence = { path = "../../crates/fence" }
# WSL 托管后端编排（supervisor WSL 分支 + commands/wsl.rs 三通道共用）。
wsl-backend = { path = "../../crates/wsl-backend" }
# session-watcher（通知限流决策逻辑）为 Phase 3 通知链预留，当前 app 零引用
# ——不加依赖（防「声明即接线」假象）；接线时随通知链一起引入。
tauri-plugin-single-instance = "2.4.3"
# 客户端更新引擎（commands/updater_client.rs）：GitHub/Gitee 双源检测+下载。
# 三者均已在依赖树内（reqwest 经 tauri-plugin-updater、sha2 经 tauri、
# rustls[ring] 经 tauri-plugin-updater 传递），此处显式声明不加新包：
# - reqwest 0.13 的 default-tls 即 rustls（锁文件全程无 native-tls）；
#   用 rustls-no-provider 与树内 tauri-plugin-updater 同款（避免引入
#   aws-lc-rs/quinn 新包），ring provider 由本引擎装进程默认（见模块）。
# - 流式下载用 Response::chunk()（无需 stream 特性），JSON 用 serde_json
#   手解（无需 json 特性）。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# URL 解析（updater 下载门禁：scheme+host 白名单）。树内已有（tauri 传递）。
url = "2"

[dev-dependencies]
# 集成测试（tests/sponsor_window.rs）用 mock runtime 走生产同款建窗路径。
tauri = { version = "2", features = ["test"] }

[features]
default = []
